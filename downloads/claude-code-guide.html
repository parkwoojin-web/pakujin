<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="개발 초보자를 위한 Claude Code 사용법 가이드와 가상 터미널 실습">
<meta name="theme-color" content="#c2410c">
<title>클로드 코드 첫걸음</title>
<style>
:root {
  --bg: #faf9f6;
  --surface: #ffffff;
  --surface-2: #f2f0eb;
  --text: #1f1e1c;
  --text-2: #5c5952;
  --border: #e3e0d8;
  --accent: #c2410c;
  --accent-soft: #fdebe1;
  --ok: #15803d;
  --ok-soft: #e3f4e8;
  --warn: #b45309;
  --code-bg: #f2f0eb;
  --term-bg: #1c1b19;
  --term-text: #e8e6e1;
  --term-dim: #9a968d;
  --term-accent: #f0a37a;
  --term-ok: #7ccf95;
  --term-warn: #f2c46d;
  --term-tool: #8ab4f8;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 2px 8px rgba(0, 0, 0, 0.04);
  --radius: 12px;
  --sidebar-w: 280px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161514;
    --surface: #1f1e1c;
    --surface-2: #2a2826;
    --text: #ecebe8;
    --text-2: #a9a59c;
    --border: #3a3835;
    --accent: #f08a5d;
    --accent-soft: #3a2519;
    --ok: #6fcf8f;
    --ok-soft: #1c3324;
    --warn: #f2c46d;
    --code-bg: #2a2826;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161514;
  --surface: #1f1e1c;
  --surface-2: #2a2826;
  --text: #ecebe8;
  --text-2: #a9a59c;
  --border: #3a3835;
  --accent: #f08a5d;
  --accent-soft: #3a2519;
  --ok: #6fcf8f;
  --ok-soft: #1c3324;
  --warn: #f2c46d;
  --code-bg: #2a2826;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.7;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); }
button { font: inherit; cursor: pointer; }
code, pre, .terminal { font-family: "D2Coding", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }

/* 헤더 */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  height: 56px; padding: 0 12px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.topbar .brand { font-weight: 700; font-size: 17px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); text-decoration: none; }
.brand .logo { color: var(--accent); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: 10px;
  border: 1px solid transparent; background: transparent; color: var(--text); font-size: 20px;
}
.icon-btn:hover { background: var(--surface-2); }
.progress-pill { font-size: 13px; color: var(--text-2); background: var(--surface-2); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }

/* 레이아웃 */
.layout { display: flex; min-height: calc(100vh - 56px); }
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--border);
  padding: 12px 8px 40px; overflow-y: auto;
  position: sticky; top: 56px; height: calc(100vh - 56px);
}
.sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-2); margin: 16px 12px 6px; }
.nav-link {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 15px; line-height: 1.4;
}
.nav-link:hover { background: var(--surface-2); }
.nav-link.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-link .status { width: 20px; text-align: center; flex-shrink: 0; color: var(--text-2); }
.nav-link .status.done { color: var(--ok); }
.main { flex: 1; min-width: 0; padding: 32px 40px 80px; }
.content { max-width: 820px; margin: 0 auto; }
.backdrop { display: none; }

@media (max-width: 900px) {
  .sidebar {
    position: fixed; left: 0; top: 56px; z-index: 30; height: calc(100vh - 56px);
    transform: translateX(-100%); transition: transform 0.2s ease; box-shadow: var(--shadow);
  }
  body.nav-open .sidebar { transform: translateX(0); }
  body.nav-open .backdrop { display: block; position: fixed; inset: 56px 0 0 0; background: rgba(0,0,0,0.35); z-index: 25; }
  .main { padding: 20px 16px 80px; }
}
@media (min-width: 901px) { #menu-btn { display: none; } }

/* 본문 */
.article h1 { font-size: 28px; line-height: 1.3; margin: 0 0 16px; }
.article h2 { font-size: 22px; margin: 40px 0 12px; padding-top: 8px; border-top: 1px solid var(--border); }
.article h3 { font-size: 18px; margin: 28px 0 8px; }
.article p, .article li { color: var(--text); }
.article ul, .article ol { padding-left: 1.4em; }
.article hr { display: none; }
.article code { background: var(--code-bg); padding: 1px 6px; border-radius: 5px; font-size: 0.9em; }
.article pre {
  position: relative; background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; overflow-x: auto; font-size: 14px; line-height: 1.55;
}
.article pre code { background: none; padding: 0; font-size: inherit; white-space: pre; }
.copy-btn {
  position: absolute; top: 6px; right: 6px; font-size: 12px;
  padding: 3px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2);
}
.copy-btn.copied { color: var(--ok); border-color: var(--ok); }
.article blockquote {
  margin: 16px 0; padding: 12px 16px; border-left: 4px solid var(--accent);
  background: var(--accent-soft); border-radius: 0 10px 10px 0;
}
.article blockquote p { margin: 4px 0; }
.table-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--border); border-radius: 10px; }
.article table { border-collapse: collapse; width: 100%; font-size: 15px; }
.article th, .article td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.article th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
.article tr:last-child td { border-bottom: none; }
.article li.task { list-style: none; margin-left: -1.4em; }
.article li.task label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.article li.task input { width: 18px; height: 18px; margin-top: 5px; accent-color: var(--ok); flex-shrink: 0; }
.article li.task.checked label { color: var(--text-2); text-decoration: line-through; }
.article details { background: var(--surface-2); border-radius: 10px; padding: 10px 16px; margin: 12px 0; }
.article details summary { cursor: pointer; font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 20px; }
.chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); }

.lesson-footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); display: grid; gap: 16px; }
.done-toggle {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px; border-radius: var(--radius); border: 2px solid var(--ok);
  background: var(--surface); color: var(--ok); font-weight: 700; font-size: 16px;
}
.done-toggle.on { background: var(--ok); color: #fff; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pager a {
  display: block; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius);
  text-decoration: none; color: var(--text); background: var(--surface);
}
.pager a small { display: block; color: var(--text-2); font-size: 12px; }
.pager .next { text-align: right; grid-column: 2; }
.practice-callout {
  display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--radius);
  background: var(--accent-soft); color: var(--text); text-decoration: none;
}
.practice-callout strong { color: var(--accent); }

/* 홈 */
.hero { padding: 28px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
.hero h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.3; }
.hero p { margin: 0 0 18px; color: var(--text-2); }
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ok); border-radius: 999px; transition: width 0.3s; }
.bar-label { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-2); margin: 6px 0 18px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 11px 18px; border-radius: 10px;
  border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 600; text-decoration: none;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.section-title { font-size: 20px; margin: 36px 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.card {
  display: block; padding: 16px; border-radius: var(--radius); background: var(--surface);
  border: 1px solid var(--border); text-decoration: none; color: var(--text); box-shadow: var(--shadow);
}
.card:hover { border-color: var(--accent); }
.card .num { font-size: 13px; color: var(--accent); font-weight: 700; }
.card h3 { margin: 4px 0 6px; font-size: 17px; line-height: 1.4; }
.card p { margin: 0; font-size: 14px; color: var(--text-2); }
.card .done-badge { float: right; color: var(--ok); font-weight: 700; font-size: 14px; }

/* 가상 터미널 */
.goal-box { padding: 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); margin-bottom: 12px; }
.goal-box .step { font-size: 13px; color: var(--accent); font-weight: 700; }
.goal-box .goal { font-size: 17px; font-weight: 600; margin: 4px 0 0; }
.goal-box .hint { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 14px; }
.goal-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.small-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; }
.terminal {
  background: var(--term-bg); color: var(--term-text); border-radius: var(--radius);
  padding: 14px 16px; min-height: 320px; max-height: 60vh; overflow-y: auto; font-size: 14px; line-height: 1.6;
  box-shadow: var(--shadow);
}
.terminal .line { white-space: pre-wrap; word-break: break-all; }
.terminal .user { color: #fff; }
.terminal .claude { color: var(--term-accent); }
.terminal .dim { color: var(--term-dim); }
.terminal .tool { color: var(--term-tool); }
.terminal .ok { color: var(--term-ok); }
.terminal .warn { color: var(--term-warn); }
.terminal .ask { color: #d7c6ff; }
.terminal .status { color: var(--term-dim); font-style: italic; }
.terminal .input-row { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
.terminal .prompt { color: var(--term-ok); white-space: nowrap; }
.terminal input {
  flex: 1; min-width: 0; background: transparent; border: none; outline: none;
  color: #fff; font: inherit; caret-color: var(--term-accent); padding: 0;
}
.keybar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.keybar button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 14px; }
.keybar .send { margin-left: auto; background: var(--accent); color: #fff; border-color: var(--accent); }
.complete-box { margin-top: 16px; padding: 18px; border-radius: var(--radius); background: var(--ok-soft); border: 1px solid var(--ok); }
.complete-box h3 { margin: 0 0 8px; color: var(--ok); }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 50;
}
.toast.show { opacity: 1; }
.footer-note { margin-top: 40px; font-size: 13px; color: var(--text-2); text-align: center; }

/* 인쇄 */
.print-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: -8px 0 20px; }
.print-cover h1 { font-size: 32px; }
.print-toc { padding-left: 2.4em; }
.print-toc li { margin: 4px 0; }
.print-date { color: var(--text-2); font-size: 14px; }
.print-lesson { margin-top: 56px; }

@media print {
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    --bg: #ffffff; --surface: #ffffff; --surface-2: #f2f0eb; --text: #000000; --text-2: #444444;
    --border: #cccccc; --accent: #9a3412; --accent-soft: #f7f2ee; --ok: #15803d; --code-bg: #f5f5f5;
    color-scheme: light;
  }
  body { background: #fff; font-size: 11pt; line-height: 1.6; }
  .topbar, .sidebar, .backdrop, .toast, .no-print, .copy-btn, .lesson-footer, .keybar { display: none !important; }
  .layout { display: block; min-height: 0; }
  .main { padding: 0; }
  .content { max-width: none; }
  a { color: inherit; text-decoration: none; }
  .article h1 { font-size: 20pt; }
  .article h2 { font-size: 15pt; break-after: avoid; }
  .article h3 { font-size: 12.5pt; break-after: avoid; }
  .article pre { white-space: pre-wrap; break-inside: avoid; }
  .article pre code { white-space: pre-wrap; }
  .table-wrap { overflow: visible; }
  .article table, .article blockquote, .article details, .article li.task { break-inside: avoid; }
  .article details > summary { list-style: none; }
  .article li.task.checked label { text-decoration: none; }
  .print-cover { break-after: page; }
  .print-lesson { margin-top: 0; break-before: page; }
  .print-lesson h1 { margin-top: 0; }
  @page { margin: 16mm 14mm; }
}

</style>
</head>

<header class="topbar">
  <button id="menu-btn" class="icon-btn" type="button" aria-label="메뉴 열기">☰</button>
  <a class="brand" href="#/"><span class="logo">✻</span> 클로드 코드 첫걸음</a>
  <span id="progress-pill" class="progress-pill">0% 완료</span>
  <button id="theme-btn" class="icon-btn" type="button" aria-label="밝게/어둡게 바꾸기">🌓</button>
</header>
<div class="layout">
  <nav id="nav" class="sidebar" aria-label="목차"></nav>

  <main id="main" class="main"></main>
</div>

<script type="application/json" id="app-data">{"lessons":[{"id":"01-before-you-start","title":"1. 시작하기 전에","order":1,"duration":"15분","lastVerified":"2026-10-12","summary":"Claude Code가 무엇이고, 채팅 Claude와 무엇이 다른지 · Claude Code를 쓰려면 무엇이 필요한지","html":"<h1>1. 시작하기 전에<\/h1>\n<h2>📌 이 페이지에서 배울 것<\/h2>\n<ul>\n<li>Claude Code가 무엇이고, 채팅 Claude와 무엇이 다른지<\/li>\n<li>Claude Code를 쓰려면 무엇이 필요한지<\/li>\n<li>터미널을 열고 기본 명령 3가지를 쓰는 법<\/li>\n<\/ul>\n<p>⏱ 예상 시간: 15분<\/p>\n<hr>\n<h2>1-1. Claude Code란?<\/h2>\n<p>Claude Code는 <strong>내 프로젝트 폴더 안에서 직접 일하는 AI 개발 도우미<\/strong>입니다.<\/p>\n<p>채팅 Claude에게 &quot;웹페이지 만들어 줘&quot;라고 하면 코드를 <strong>글로 보여 줍니다.<\/strong> 그 코드를 복사해서 파일로 저장하고 실행하는 일은 내가 해야 합니다.<\/p>\n<p>Claude Code에게 같은 요청을 하면 <strong>파일을 직접 만들고, 실행해 보고, 문제가 있으면 고칩니다.<\/strong> 나는 결과를 확인하고 승인만 하면 됩니다.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>채팅 Claude<\/th>\n<th>Claude Code<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>비유<\/td>\n<td>옆에서 조언해 주는 선배<\/td>\n<td>내 컴퓨터에 앉아 직접 일하는 동료<\/td>\n<\/tr>\n<tr>\n<td>코드<\/td>\n<td>글로 보여 줌<\/td>\n<td>파일을 직접 만들고 고침<\/td>\n<\/tr>\n<tr>\n<td>실행<\/td>\n<td>못 함<\/td>\n<td>명령을 실행하고 결과를 확인<\/td>\n<\/tr>\n<tr>\n<td>에러<\/td>\n<td>내가 복사해서 알려 줘야 함<\/td>\n<td>스스로 보고 고침<\/td>\n<\/tr>\n<tr>\n<td>잘 맞는 일<\/td>\n<td>아이디어, 설명, 짧은 코드<\/td>\n<td>실제로 돌아가는 프로그램 만들기<\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote>\n<p>💡 둘 다 같은 Claude입니다. 차이는 <strong>손이 있느냐<\/strong>입니다. Claude Code는 파일을 읽고 쓰고 명령을 실행할 수 있는 &quot;손&quot;을 가진 Claude입니다.<\/p>\n<\/blockquote>\n<hr>\n<h2>1-2. 할 수 있는 것과 못 하는 것<\/h2>\n<p><strong>✅ 잘하는 것<\/strong><\/p>\n<ul>\n<li>웹페이지, 앱, 간단한 프로그램을 처음부터 만들기<\/li>\n<li>이미 있는 코드를 읽고 설명하기<\/li>\n<li>에러 원인을 찾아서 고치기<\/li>\n<li>여러 파일을 한꺼번에 고치기<\/li>\n<li>Git 커밋, GitHub에 올리기<\/li>\n<\/ul>\n<p><strong>❌ 대신 못 하는 것<\/strong><\/p>\n<ul>\n<li><strong>무엇을 만들지 정하기<\/strong>: 아이디어와 요구사항은 내가 정해야 합니다.<\/li>\n<li><strong>계정·결제가 필요한 일<\/strong>: 도메인 구입, 앱스토어 등록, 클라우드 결제<\/li>\n<li><strong>비밀번호·API 키 만들기<\/strong>: 직접 발급받아 알려 줘야 합니다.<\/li>\n<li><strong>100% 정확함<\/strong>: 실수할 수 있으므로 결과는 꼭 직접 확인해야 합니다.<\/li>\n<\/ul>\n<hr>\n<h2>1-3. 필요한 것<\/h2>\n<table>\n<thead>\n<tr>\n<th>필요한 것<\/th>\n<th>설명<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>유료 계정<\/strong><\/td>\n<td>Claude <strong>Pro, Max, Team, Enterprise<\/strong> 요금제 또는 <strong>Console(API) 계정<\/strong>. ⚠️ <strong>무료 요금제로는 쓸 수 없습니다.<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>컴퓨터<\/strong><\/td>\n<td>Windows 10(1809 이상), macOS 13 이상, 또는 Ubuntu 20.04 이상 등 Linux. 메모리 4GB 이상<\/td>\n<\/tr>\n<tr>\n<td><strong>인터넷<\/strong><\/td>\n<td>항상 연결되어 있어야 합니다<\/td>\n<\/tr>\n<tr>\n<td><strong>(Windows 권장) Git for Windows<\/strong><\/td>\n<td>없어도 동작하지만, 있으면 더 많은 기능을 쓸 수 있습니다. 2장에서 설치합니다<\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote>\n<p>💡 예전에는 Node.js가 필요했지만, <strong>지금 권장하는 설치 방법은 Node.js가 필요 없습니다.<\/strong><\/p>\n<\/blockquote>\n<hr>\n<h2>1-4. 어디에서 쓸까?<\/h2>\n<p>Claude Code는 여러 곳에서 쓸 수 있습니다. 처음에는 <strong>하나만<\/strong> 고르세요.<\/p>\n<table>\n<thead>\n<tr>\n<th>방식<\/th>\n<th>특징<\/th>\n<th>추천 대상<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>터미널 (CLI)<\/strong><\/td>\n<td>가장 기본. 모든 기능 사용 가능<\/td>\n<td>이 가이드의 기본 방식 ⭐<\/td>\n<\/tr>\n<tr>\n<td><strong>데스크톱 앱<\/strong><\/td>\n<td>터미널 없이 창에서 사용<\/td>\n<td>터미널이 정말 부담스러운 분<\/td>\n<\/tr>\n<tr>\n<td><strong>VS Code 확장<\/strong><\/td>\n<td>코드 편집기 안에서 사용<\/td>\n<td>VS Code를 이미 쓰는 분<\/td>\n<\/tr>\n<tr>\n<td><strong>웹 (claude.ai/code)<\/strong><\/td>\n<td>설치 없이 브라우저에서. 작업은 클라우드에서 하고 GitHub에 저장<\/td>\n<td>GitHub를 쓰는 분, 폰에서 쓰고 싶은 분<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>이 가이드는 <strong>터미널 방식<\/strong>을 기준으로 설명합니다. 다른 방식도 명령어와 사용법은 거의 같습니다.<\/p>\n<hr>\n<h2>1-5. 터미널 기초 5분<\/h2>\n<p>터미널은 <strong>글자로 컴퓨터에 명령하는 창<\/strong>입니다. 마우스로 폴더를 여는 대신, 글자로 &quot;이 폴더로 가&quot;라고 입력합니다.<\/p>\n<h3>터미널 여는 법<\/h3>\n<table>\n<thead>\n<tr>\n<th>운영체제<\/th>\n<th>여는 법<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Windows<\/strong><\/td>\n<td>시작 버튼 → <code>PowerShell<\/code> 검색 → 클릭<\/td>\n<\/tr>\n<tr>\n<td><strong>macOS<\/strong><\/td>\n<td><code>Cmd + Space<\/code> → <code>터미널<\/code> 입력 → Enter<\/td>\n<\/tr>\n<tr>\n<td><strong>Linux<\/strong><\/td>\n<td><code>Ctrl + Alt + T<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>열리면 이런 줄이 보입니다. 이것을 <strong>프롬프트<\/strong>라고 하며, &quot;명령을 기다리고 있어요&quot;라는 뜻입니다.<\/p>\n<pre><code>PS C:\\Users\\홍길동&gt;          ← Windows PowerShell\n홍길동@MacBook ~ %           ← macOS\n<\/code><\/pre>\n<h3>꼭 알아야 할 명령 3가지<\/h3>\n<p><strong>① 지금 위치의 파일 보기<\/strong><\/p>\n<pre><code class=\"language-bash\">ls\n<\/code><\/pre>\n<p>(Windows CMD에서는 <code>dir<\/code>. PowerShell에서는 <code>ls<\/code>도 됩니다)<\/p>\n<p><strong>② 새 폴더 만들기<\/strong><\/p>\n<pre><code class=\"language-bash\">mkdir my-first-project\n<\/code><\/pre>\n<p><strong>③ 폴더로 이동하기<\/strong><\/p>\n<pre><code class=\"language-bash\">cd my-first-project\n<\/code><\/pre>\n<p>상위 폴더로 돌아가려면:<\/p>\n<pre><code class=\"language-bash\">cd ..\n<\/code><\/pre>\n<h3>터미널 꿀팁<\/h3>\n<ul>\n<li><strong><code>Tab<\/code> 키<\/strong>: 폴더 이름 앞 글자만 치고 누르면 자동 완성됩니다.<\/li>\n<li><strong><code>↑<\/code> 키<\/strong>: 방금 입력한 명령을 다시 불러옵니다.<\/li>\n<li><strong>붙여넣기<\/strong>: Windows는 <code>Ctrl + V<\/code> 또는 마우스 오른쪽 클릭, macOS는 <code>Cmd + V<\/code><\/li>\n<li><strong>실행 중인 것 멈추기<\/strong>: <code>Ctrl + C<\/code><\/li>\n<\/ul>\n<hr>\n<h2>✅ 확인하기<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> Claude Code와 채팅 Claude의 차이를 한 문장으로 말할 수 있다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 내 Claude 요금제가 Pro 이상인지 확인했다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 터미널을 열 수 있다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>mkdir<\/code>로 <code>my-first-project<\/code> 폴더를 만들고 <code>cd<\/code>로 들어갔다<\/li>\n<\/ul>\n<h2>⚠️ 자주 하는 실수<\/h2>\n<ul>\n<li><strong>무료 요금제로 시작하려는 경우<\/strong>: 로그인 단계에서 막힙니다. 먼저 요금제를 확인하세요.<\/li>\n<li><strong>명령어 오타<\/strong>: <code>cd<\/code>와 폴더 이름 사이에는 <strong>띄어쓰기<\/strong>가 필요합니다. <code>cdmy-first-project<\/code> ❌<\/li>\n<li><strong>폴더 이름에 띄어쓰기<\/strong>: <code>my project<\/code>처럼 띄어 쓰면 불편합니다. <code>my-project<\/code>처럼 <code>-<\/code>를 쓰세요.<\/li>\n<\/ul>\n<h2>🧠 퀴즈<\/h2>\n<ol>\n<li>Claude Code가 채팅 Claude와 가장 크게 다른 점은?<ul>\n<li>(가) 더 똑똑한 모델을 쓴다<\/li>\n<li>(나) 파일을 직접 만들고 명령을 실행할 수 있다<\/li>\n<li>(다) 무료다<\/li>\n<\/ul>\n<\/li>\n<li>폴더 안으로 이동하는 명령은?<ul>\n<li>(가) <code>ls<\/code>  (나) <code>mkdir<\/code>  (다) <code>cd<\/code><\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<details>\n<summary>정답 보기<\/summary>\n\n<ol>\n<li>(나) — 같은 Claude지만 파일과 명령을 다룰 &quot;손&quot;이 있습니다.<\/li>\n<li>(다) — <code>ls<\/code>는 목록 보기, <code>mkdir<\/code>은 폴더 만들기입니다.<\/li>\n<\/ol>\n<\/details>\n\n<h2>➡️ 다음 단계<\/h2>\n<p><a href=\"#/lesson/02-install-and-first-run\">2. 설치와 첫 실행<\/a>에서 Claude Code를 설치하고 첫 웹페이지를 만들어 봅니다.<\/p>\n"},{"id":"02-install-and-first-run","title":"2. 설치와 첫 실행","order":2,"duration":"20분","lastVerified":"2026-10-12","summary":"내 컴퓨터에 Claude Code 설치하기 · 로그인하고 처음 실행하기","html":"<h1>2. 설치와 첫 실행<\/h1>\n<h2>📌 이 페이지에서 배울 것<\/h2>\n<ul>\n<li>내 컴퓨터에 Claude Code 설치하기<\/li>\n<li>로그인하고 처음 실행하기<\/li>\n<li>Claude Code로 첫 웹페이지 만들기<\/li>\n<\/ul>\n<p>⏱ 예상 시간: 20분<\/p>\n<hr>\n<h2>2-1. 설치하기<\/h2>\n<p>터미널을 열고, <strong>내 운영체제에 맞는 명령 한 줄<\/strong>을 복사해서 붙여 넣은 뒤 Enter를 누르세요.<\/p>\n<h3>🪟 Windows<\/h3>\n<p>먼저 내가 어떤 터미널에 있는지 확인합니다.<\/p>\n<ul>\n<li>줄 앞에 <strong><code>PS<\/code><\/strong>가 보이면 → <strong>PowerShell<\/strong> (예: <code>PS C:\\Users\\홍길동&gt;<\/code>)<\/li>\n<li><code>PS<\/code> 없이 <code>C:\\<\/code>로 시작하면 → <strong>CMD<\/strong><\/li>\n<\/ul>\n<p><strong>PowerShell이라면:<\/strong><\/p>\n<pre><code class=\"language-powershell\">irm https://claude.ai/install.ps1 | iex\n<\/code><\/pre>\n<p><strong>CMD라면:<\/strong><\/p>\n<pre><code class=\"language-batch\">curl -fsSL https://claude.ai/install.cmd -o install.cmd &amp;&amp; install.cmd &amp;&amp; del install.cmd\n<\/code><\/pre>\n<blockquote>\n<p>💡 관리자 권한으로 실행할 필요는 없습니다.<\/p>\n<\/blockquote>\n<p><strong>(권장) Git for Windows 설치하기<\/strong>\nClaude Code는 Git for Windows가 없어도 동작하지만, 설치하면 더 많은 기능을 쓸 수 있고 7장(Git·GitHub)에서도 필요합니다.<\/p>\n<ol>\n<li><a href=\"https://git-scm.com/downloads/win\">https://git-scm.com/downloads/win<\/a> 에서 내려받습니다.<\/li>\n<li>설치 화면에서는 <strong>기본값 그대로 Next<\/strong>를 계속 누르면 됩니다.<\/li>\n<\/ol>\n<h3>🍎 macOS / 🐧 Linux<\/h3>\n<pre><code class=\"language-bash\">curl -fsSL https://claude.ai/install.sh | bash\n<\/code><\/pre>\n<h3>설치가 조용해도 정상입니다<\/h3>\n<p>설치 명령은 내려받는 동안 <strong>진행 상황을 보여 주지 않습니다.<\/strong> 끝날 때까지 기다려 주세요.<\/p>\n<blockquote>\n<p>다른 설치 방법도 있습니다. macOS의 Homebrew(<code>brew install --cask claude-code<\/code>)나 Windows의 WinGet(<code>winget install Anthropic.ClaudeCode<\/code>)으로 설치하면 <strong>자동 업데이트가 되지 않으므로<\/strong>, 초보자에게는 위의 기본 방법을 추천합니다.<\/p>\n<\/blockquote>\n<hr>\n<h2>2-2. 설치 확인하기<\/h2>\n<p><strong>터미널 창을 닫고 새로 연 다음<\/strong> 입력합니다.<\/p>\n<pre><code class=\"language-bash\">claude --version\n<\/code><\/pre>\n<p>이렇게 버전 번호가 나오면 성공입니다.<\/p>\n<pre><code>2.1.xxx (Claude Code)\n<\/code><\/pre>\n<p>더 자세히 점검하려면:<\/p>\n<pre><code class=\"language-bash\">claude doctor\n<\/code><\/pre>\n<p>설치 상태와 설정 문제를 확인하고, 문제가 있으면 해결 방법을 알려 줍니다.<\/p>\n<hr>\n<h2>2-3. 처음 실행하고 로그인하기<\/h2>\n<p><strong>① 연습용 폴더로 이동합니다<\/strong> (1장에서 만든 폴더)<\/p>\n<pre><code class=\"language-bash\">cd my-first-project\n<\/code><\/pre>\n<p><strong>② Claude Code를 실행합니다<\/strong><\/p>\n<pre><code class=\"language-bash\">claude\n<\/code><\/pre>\n<p><strong>③ 처음 실행하면 몇 가지를 물어봅니다<\/strong><\/p>\n<ul>\n<li><strong>화면 색상(테마)<\/strong>: 화살표 키로 고르고 Enter<\/li>\n<li><strong>로그인<\/strong>: 브라우저가 열리면 Claude 계정으로 로그인하고 허용을 누릅니다. 끝나면 터미널로 돌아옵니다.<\/li>\n<li><strong>이 폴더를 믿을지<\/strong>: 내가 만든 연습 폴더이므로 허용합니다.<\/li>\n<\/ul>\n<blockquote>\n<p>⚠️ 모르는 사람에게 받은 폴더에서는 신뢰를 허용하기 전에 한 번 더 생각하세요. Claude Code가 그 폴더의 설정 파일을 따르기 때문입니다.<\/p>\n<\/blockquote>\n<p><strong>④ 입력창이 나타나면 준비 완료!<\/strong><\/p>\n<hr>\n<h2>2-4. 첫 화면 둘러보기<\/h2>\n<blockquote>\n<p>📷 (스크린샷 자리: Claude Code 첫 화면)<\/p>\n<\/blockquote>\n<table>\n<thead>\n<tr>\n<th>부분<\/th>\n<th>설명<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>입력창<\/strong><\/td>\n<td>여기에 한국어로 요청을 씁니다<\/td>\n<\/tr>\n<tr>\n<td><strong>대화 영역<\/strong><\/td>\n<td>내 요청, Claude의 답, Claude가 한 작업이 순서대로 쌓입니다<\/td>\n<\/tr>\n<tr>\n<td><strong>권한 요청 창<\/strong><\/td>\n<td>Claude가 파일을 만들거나 명령을 실행하기 전에 &quot;해도 될까요?&quot;라고 묻습니다<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>화면 아래 상태 표시줄: 권한 모드<\/h3>\n<p>입력창 아래에 <strong>지금 권한 모드<\/strong>가 표시됩니다. 최신 버전은 처음에 보통 이렇게 시작합니다.<\/p>\n<pre><code>⏵⏵ auto mode on\n<\/code><\/pre>\n<p><strong>자동 모드(auto mode)<\/strong>에서는 Claude가 매번 허락을 묻지 않고 작업합니다. 대신 별도의 안전 검사기가 위험해 보이는 작업을 막아 줍니다.<\/p>\n<blockquote>\n<p>💡 <strong>처음 배울 때는 수동 모드를 추천합니다.<\/strong> <code>Shift + Tab<\/code>을 한 번 누르면 <code>⏸ manual mode on<\/code>으로 바뀝니다. 수동 모드에서는 Claude가 파일을 만들거나 명령을 실행하기 전에 매번 물어보므로, <strong>무엇을 하는지 보면서 배울 수 있습니다.<\/strong> 권한 모드는 6장에서 자세히 배웁니다.<\/p>\n<\/blockquote>\n<h3>권한 요청 창 읽는 법 (수동 모드)<\/h3>\n<p>수동 모드에서는 Claude가 파일을 바꾸거나 명령을 실행하기 전에 허락을 구합니다. 대략 이런 선택지가 나옵니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>선택<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Yes<\/strong><\/td>\n<td>이번 한 번만 허용<\/td>\n<\/tr>\n<tr>\n<td><strong>Yes, and don&#39;t ask again …<\/strong><\/td>\n<td>이런 종류의 작업은 앞으로 묻지 않고 허용<\/td>\n<\/tr>\n<tr>\n<td><strong>No<\/strong><\/td>\n<td>거절. Claude가 멈추고 내 다음 말을 기다립니다<\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote>\n<p>💡 <strong>Yes<\/strong>나 <strong>No<\/strong>에 커서를 두고 <code>Tab<\/code>을 누르면 짧은 메모를 덧붙일 수 있습니다. 예: No + &quot;파일 이름은 index.html로 해 줘&quot;<\/p>\n<\/blockquote>\n<hr>\n<h2>2-5. ✅ 첫 성공 미션: 나의 첫 웹페이지<\/h2>\n<p>입력창에 아래 문장을 그대로 입력해 보세요.<\/p>\n<pre><code class=\"language-text\">hello.html 파일을 만들어 줘. 가운데에 &quot;안녕하세요, 저는 ○○입니다&quot;라고 크게 쓰고, 배경은 하늘색으로 해 줘.\n<\/code><\/pre>\n<p><strong>일어나는 일<\/strong> (수동 모드 기준)<\/p>\n<ol>\n<li>Claude가 무엇을 할지 설명합니다.<\/li>\n<li><code>hello.html<\/code> 파일을 만들어도 되는지 묻습니다. → <strong>Yes<\/strong><\/li>\n<li>파일이 만들어집니다.<\/li>\n<\/ol>\n<p>자동 모드라면 묻지 않고 바로 파일을 만듭니다.<\/p>\n<p><strong>결과 확인하기<\/strong><\/p>\n<ul>\n<li>파일 탐색기(macOS는 Finder)에서 <code>my-first-project<\/code> 폴더를 열고 <code>hello.html<\/code>을 <strong>더블클릭<\/strong>하면 브라우저에 페이지가 열립니다.<\/li>\n<li>또는 Claude에게 &quot;방금 만든 파일 브라우저로 열어 줘&quot;라고 요청해도 됩니다.<\/li>\n<\/ul>\n<p><strong>한 단계 더<\/strong>: 바꾸고 싶은 점을 말로 요청해 보세요.<\/p>\n<pre><code class=\"language-text\">글자 아래에 오늘 날짜를 작게 보여 주고, 글자에 그림자를 넣어 줘.\n<\/code><\/pre>\n<p>브라우저에서 새로고침(<code>F5<\/code>, macOS는 <code>Cmd + R<\/code>)하면 바뀐 결과가 보입니다.<\/p>\n<p>🎉 <strong>축하합니다!<\/strong> 코드를 한 줄도 직접 쓰지 않고 웹페이지를 만들었습니다.<\/p>\n<hr>\n<h2>2-6. 끝내기와 다시 시작하기<\/h2>\n<table>\n<thead>\n<tr>\n<th>하고 싶은 것<\/th>\n<th>방법<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Claude Code 끝내기<\/td>\n<td><code>/exit<\/code> 입력, 또는 <code>Ctrl + C<\/code>를 두 번<\/td>\n<\/tr>\n<tr>\n<td>다시 시작<\/td>\n<td>같은 폴더에서 <code>claude<\/code><\/td>\n<\/tr>\n<tr>\n<td>지난 대화 이어 하기<\/td>\n<td><code>claude<\/code> 실행 후 <code>/resume<\/code><\/td>\n<\/tr>\n<tr>\n<td>Claude가 작업 중일 때 멈추기<\/td>\n<td><code>Esc<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<hr>\n<h2>✅ 확인하기<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> <code>claude --version<\/code>으로 버전 번호를 확인했다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 로그인을 마쳤다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>Shift + Tab<\/code>으로 수동 모드(<code>manual mode on<\/code>)로 바꿔 봤다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>hello.html<\/code>을 만들고 브라우저에서 열어 봤다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 말로 수정 요청을 해서 페이지를 바꿔 봤다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>/exit<\/code>로 끝내고 다시 <code>claude<\/code>로 시작해 봤다<\/li>\n<\/ul>\n<h2>⚠️ 자주 하는 실수와 해결법<\/h2>\n<table>\n<thead>\n<tr>\n<th>증상<\/th>\n<th>원인<\/th>\n<th>해결<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>claude<\/code>를 찾을 수 없다고 나옴 (<code>not recognized<\/code>, <code>command not found<\/code>)<\/td>\n<td>설치 직후 터미널을 새로 열지 않음<\/td>\n<td><strong>터미널을 닫고 새로 열기<\/strong>. 그래도 안 되면 컴퓨터 재시작<\/td>\n<\/tr>\n<tr>\n<td><code>The token &#39;&amp;&amp;&#39; is not a valid statement separator<\/code><\/td>\n<td>PowerShell에서 CMD용 명령을 입력함<\/td>\n<td>PowerShell용 명령(<code>irm ... | iex<\/code>)을 사용<\/td>\n<\/tr>\n<tr>\n<td><code>&#39;irm&#39; is not recognized<\/code><\/td>\n<td>CMD에서 PowerShell용 명령을 입력함<\/td>\n<td>CMD용 명령(<code>curl ... install.cmd<\/code>)을 사용<\/td>\n<\/tr>\n<tr>\n<td>로그인했는데 사용할 수 없다고 나옴<\/td>\n<td>무료 요금제<\/td>\n<td>Pro 이상 요금제로 변경<\/td>\n<\/tr>\n<tr>\n<td>엉뚱한 폴더에 파일이 생김<\/td>\n<td><code>cd<\/code>로 이동하지 않고 <code>claude<\/code>를 실행함<\/td>\n<td><code>/exit<\/code> → <code>cd my-first-project<\/code> → <code>claude<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>그 밖의 문제는 <code>claude doctor<\/code>를 실행하거나, 공식 문제 해결 문서(<a href=\"https://code.claude.com/docs/en/troubleshoot-install)%EB%A5%BC\">https://code.claude.com/docs/en/troubleshoot-install)를<\/a> 확인하세요.<\/p>\n<h2>🧠 퀴즈<\/h2>\n<ol>\n<li>설치 후 <code>claude<\/code>를 찾을 수 없다는 메시지가 나오면 가장 먼저 할 일은?<ul>\n<li>(가) 다시 설치한다  (나) 터미널을 새로 연다  (다) 컴퓨터를 포맷한다<\/li>\n<\/ul>\n<\/li>\n<li>수동 모드에서 Claude가 파일을 만들기 전에 묻는 창에서 &quot;이번 한 번만&quot; 허용하려면?<ul>\n<li>(가) Yes  (나) Yes, and don&#39;t ask again  (다) No<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<details>\n<summary>정답 보기<\/summary>\n\n<ol>\n<li>(나) — 새 터미널을 열어야 설치된 <code>claude<\/code> 명령을 인식합니다.<\/li>\n<li>(가)<\/li>\n<\/ol>\n<\/details>\n\n<h2>➡️ 다음 단계<\/h2>\n<p><a href=\"#/lesson/03-basics\">3. 기본 사용법<\/a>에서 파일 지정하기, 대화 관리하기 등 매일 쓰는 기능을 배웁니다.<\/p>\n"},{"id":"03-basics","title":"3. 기본 사용법","order":3,"duration":"25분","lastVerified":"2026-10-12","summary":"질문하기와 작업 시키기의 차이 · 파일 지정, 멈추기, 되돌리기 등 매일 쓰는 조작","html":"<h1>3. 기본 사용법<\/h1>\n<h2>📌 이 페이지에서 배울 것<\/h2>\n<ul>\n<li>질문하기와 작업 시키기의 차이<\/li>\n<li>파일 지정, 멈추기, 되돌리기 등 매일 쓰는 조작<\/li>\n<li>대화가 길어졌을 때 관리하는 법<\/li>\n<\/ul>\n<p>⏱ 예상 시간: 25분<\/p>\n<blockquote>\n<p>🛠 준비: 2장에서 만든 <code>my-first-project<\/code> 폴더에서 <code>claude<\/code>를 실행해 두세요.<\/p>\n<\/blockquote>\n<hr>\n<h2>3-1. 질문하기 vs 작업 시키기<\/h2>\n<p>Claude Code에게 하는 말은 크게 두 종류입니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>종류<\/th>\n<th>예시<\/th>\n<th>Claude가 하는 일<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>질문<\/strong><\/td>\n<td>&quot;hello.html이 어떻게 동작하는지 설명해 줘&quot;<\/td>\n<td>파일을 읽고 설명만 함. 아무것도 바꾸지 않음<\/td>\n<\/tr>\n<tr>\n<td><strong>작업<\/strong><\/td>\n<td>&quot;hello.html에 버튼을 하나 추가해 줘&quot;<\/td>\n<td>파일을 고침. 수동 모드라면 바꾸기 전에 허락을 구함<\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote>\n<p>💡 처음 보는 코드라면 <strong>질문 먼저, 작업은 나중에<\/strong> 하세요. &quot;이 프로젝트 구조를 설명해 줘&quot;는 언제나 좋은 첫 질문입니다.<\/p>\n<\/blockquote>\n<h3>💻 따라 하기<\/h3>\n<pre><code class=\"language-text\">이 폴더에 어떤 파일이 있고, 각각 무슨 역할인지 설명해 줘.\n<\/code><\/pre>\n<hr>\n<h2>3-2. 입력창에서 쓰는 특수 기호 3가지<\/h2>\n<p>입력창 <strong>맨 앞<\/strong>이나 문장 안에 아래 기호를 쓰면 특별한 기능이 동작합니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>기호<\/th>\n<th>기능<\/th>\n<th>예시<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>@<\/code><\/td>\n<td><strong>파일 지정<\/strong>. 입력하면 파일 목록이 뜨고 <code>Tab<\/code>으로 고름<\/td>\n<td><code>@hello.html 이 파일의 글자 색을 바꿔 줘<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>/<\/code><\/td>\n<td><strong>명령어<\/strong>. 맨 앞에 입력<\/td>\n<td><code>/help<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>!<\/code><\/td>\n<td><strong>터미널 명령 바로 실행<\/strong>. 맨 앞에 입력. 결과를 Claude도 봄<\/td>\n<td><code>!ls<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote>\n<p>💡 <code>@<\/code>로 파일을 지정하면 Claude가 어떤 파일을 말하는지 헷갈리지 않아서 결과가 더 정확해집니다.<\/p>\n<\/blockquote>\n<h3>💻 따라 하기<\/h3>\n<pre><code class=\"language-text\">@hello.html 이 파일에 &quot;더 알아보기&quot; 버튼을 추가하고, 누르면 &quot;반가워요!&quot; 알림이 뜨게 해 줘.\n<\/code><\/pre>\n<hr>\n<h2>3-3. 꼭 외울 단축키<\/h2>\n<table>\n<thead>\n<tr>\n<th>단축키<\/th>\n<th>기능<\/th>\n<th>언제 쓰나<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>Esc<\/code><\/td>\n<td><strong>Claude 멈추기<\/strong><\/td>\n<td>엉뚱한 방향으로 갈 때. 지금까지 한 작업은 남음<\/td>\n<\/tr>\n<tr>\n<td><code>Esc<\/code> 두 번 (입력창이 비어 있을 때)<\/td>\n<td><strong>되돌리기 메뉴<\/strong> 열기<\/td>\n<td>이전 시점으로 코드나 대화를 되돌릴 때<\/td>\n<\/tr>\n<tr>\n<td><code>Shift + Tab<\/code><\/td>\n<td><strong>권한 모드 바꾸기<\/strong><\/td>\n<td>6장에서 자세히<\/td>\n<\/tr>\n<tr>\n<td><code>↑<\/code><\/td>\n<td>이전에 입력한 내용 불러오기<\/td>\n<td>같은 요청을 조금 바꿔 다시 보낼 때<\/td>\n<\/tr>\n<tr>\n<td><code>Ctrl + C<\/code><\/td>\n<td>작업 중단. 아무것도 없을 때 두 번 누르면 종료<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>?<\/code> (입력창이 비어 있을 때)<\/td>\n<td>단축키 도움말 보기<\/td>\n<td>단축키가 기억나지 않을 때<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>여러 줄 입력하기<\/h3>\n<p>Enter를 누르면 바로 전송됩니다. 줄을 바꾸고 싶으면:<\/p>\n<ul>\n<li><strong><code>\\<\/code>를 입력하고 Enter<\/strong> — 모든 터미널에서 동작<\/li>\n<li><strong><code>Ctrl + J<\/code><\/strong> — 모든 터미널에서 동작<\/li>\n<li><strong><code>Shift + Enter<\/code><\/strong> — Windows Terminal, macOS 터미널 등에서 바로 동작. 안 되면 <code>/terminal-setup<\/code><\/li>\n<\/ul>\n<h3>이미지 붙여 넣기<\/h3>\n<p>화면 캡처를 복사한 뒤 입력창에서 붙여 넣으면 이미지를 보여 줄 수 있습니다.<\/p>\n<ul>\n<li>macOS: <code>Ctrl + V<\/code> (iTerm2는 <code>Cmd + V<\/code>)<\/li>\n<li>Windows: <code>Alt + V<\/code><\/li>\n<\/ul>\n<pre><code class=\"language-text\">[이미지] 이 디자인처럼 hello.html을 바꿔 줘.\n<\/code><\/pre>\n<hr>\n<h2>3-4. 작업 중에 말 걸기<\/h2>\n<p>Claude가 작업하는 중에도 메시지를 입력할 수 있습니다. 보낸 메시지는 <strong>대기열에 들어갔다가<\/strong> Claude가 이어서 읽습니다.<\/p>\n<ul>\n<li>방향을 살짝 바꾸고 싶을 때: 그냥 입력해서 보내기<\/li>\n<li>완전히 잘못 가고 있을 때: <code>Esc<\/code>로 멈추고 다시 설명하기<\/li>\n<\/ul>\n<hr>\n<h2>3-5. 되돌리기: <code>/rewind<\/code><\/h2>\n<p>Claude가 코드를 마음에 안 들게 바꿨다면 걱정하지 마세요.<\/p>\n<ol>\n<li><code>/rewind<\/code> 입력 (또는 빈 입력창에서 <code>Esc<\/code> 두 번)<\/li>\n<li>돌아가고 싶은 시점의 내 메시지를 고르기<\/li>\n<li><strong>코드만, 대화만, 또는 둘 다<\/strong> 되돌릴지 선택<\/li>\n<\/ol>\n<blockquote>\n<p>⚠️ <code>/rewind<\/code>는 Claude가 <strong>파일을 직접 고친 것<\/strong>을 되돌립니다. Claude가 실행한 터미널 명령의 결과(예: 설치한 프로그램, 지운 파일)까지 모두 되돌리지는 못할 수 있습니다. 중요한 작업 전에는 7장에서 배울 <strong>Git 커밋<\/strong>으로 저장해 두세요.<\/p>\n<\/blockquote>\n<hr>\n<h2>3-6. 대화 관리하기<\/h2>\n<p>Claude는 대화 내용을 <strong>작업 공간(컨텍스트)<\/strong>에 담아 두고 기억합니다. 이 공간에는 한계가 있어서, 대화가 길어지면 앞 내용을 놓치거나 느려질 수 있습니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>명령어<\/th>\n<th>비유<\/th>\n<th>언제 쓰나<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>/context<\/code><\/td>\n<td>공책이 얼마나 찼는지 보기<\/td>\n<td>느려졌다고 느낄 때<\/td>\n<\/tr>\n<tr>\n<td><code>/compact<\/code><\/td>\n<td>앞부분을 <strong>요약 메모로 바꾸고 계속 쓰기<\/strong><\/td>\n<td>같은 작업을 계속하는데 대화가 길어졌을 때<\/td>\n<\/tr>\n<tr>\n<td><code>/clear<\/code><\/td>\n<td><strong>새 공책으로 바꾸기<\/strong><\/td>\n<td>전혀 다른 작업을 시작할 때<\/td>\n<\/tr>\n<tr>\n<td><code>/resume<\/code><\/td>\n<td>예전 공책 다시 펼치기<\/td>\n<td>어제 하던 대화를 이어 할 때<\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre><code class=\"language-text\">/compact 버튼 기능 작업 내용 위주로 남겨줘\n<\/code><\/pre>\n<blockquote>\n<p>💡 <strong>좋은 습관<\/strong>: 작업 하나가 끝나면 <code>/clear<\/code>. 대화가 깨끗할수록 Claude가 더 정확합니다. 프로젝트 규칙은 4장의 <code>CLAUDE.md<\/code>에 적어 두면 <code>/clear<\/code> 후에도 사라지지 않습니다.<\/p>\n<\/blockquote>\n<hr>\n<h2>3-7. 모델과 사용량<\/h2>\n<table>\n<thead>\n<tr>\n<th>명령어<\/th>\n<th>기능<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>/model<\/code><\/td>\n<td>AI 모델 고르기. 더 강한 모델은 어려운 일에 좋지만 사용량을 더 씁니다<\/td>\n<\/tr>\n<tr>\n<td><code>/effort<\/code><\/td>\n<td>얼마나 깊이 생각할지 정하기 (<code>low<\/code> ~ <code>max<\/code>, <code>auto<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>/usage<\/code><\/td>\n<td>지금까지의 사용량과 요금제 한도 보기<\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote>\n<p>💡 처음에는 <strong>기본 설정 그대로<\/strong> 써도 충분합니다. 결과가 아쉬울 때 바꿔 보세요.<\/p>\n<\/blockquote>\n<hr>\n<h2>3-8. 기능 둘러보기: <code>/powerup<\/code><\/h2>\n<pre><code class=\"language-text\">/powerup\n<\/code><\/pre>\n<p>애니메이션 데모가 있는 짧은 대화형 레슨으로 Claude Code 기능을 둘러볼 수 있습니다. 이 장을 마친 뒤 한 번 해 보세요.<\/p>\n<hr>\n<h2>✅ 확인하기<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> <code>@<\/code>로 파일을 지정해서 요청해 봤다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>!ls<\/code>로 터미널 명령을 바로 실행해 봤다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> Claude가 작업 중일 때 <code>Esc<\/code>로 멈춰 봤다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>/rewind<\/code>로 변경을 되돌려 봤다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>/context<\/code>로 공간이 얼마나 찼는지 확인하고 <code>/clear<\/code>로 새로 시작해 봤다<\/li>\n<\/ul>\n<h2>⚠️ 자주 하는 실수<\/h2>\n<ul>\n<li><strong>한 대화에서 모든 일을 하기<\/strong>: 대화가 길어질수록 정확도가 떨어집니다. 작업 단위로 <code>/clear<\/code> 하세요.<\/li>\n<li><strong><code>/clear<\/code>하면 규칙도 사라진다고 착각하기<\/strong>: <code>CLAUDE.md<\/code>에 적은 내용은 매번 다시 읽습니다.<\/li>\n<li><strong><code>Esc<\/code>가 모든 것을 취소한다고 생각하기<\/strong>: <code>Esc<\/code>는 멈추기만 합니다. 이미 바뀐 파일은 <code>/rewind<\/code>로 되돌리세요.<\/li>\n<\/ul>\n<h2>🧠 퀴즈<\/h2>\n<ol>\n<li>다른 작업을 새로 시작할 때 쓰는 명령어는?<ul>\n<li>(가) <code>/compact<\/code>  (나) <code>/clear<\/code>  (다) <code>/model<\/code><\/li>\n<\/ul>\n<\/li>\n<li>특정 파일을 지정해서 요청할 때 쓰는 기호는?<ul>\n<li>(가) <code>@<\/code>  (나) <code>!<\/code>  (다) <code>#<\/code><\/li>\n<\/ul>\n<\/li>\n<li>Claude가 고친 코드를 이전 상태로 되돌리려면?<ul>\n<li>(가) <code>Esc<\/code> 한 번  (나) <code>/rewind<\/code>  (다) <code>/usage<\/code><\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<details>\n<summary>정답 보기<\/summary>\n\n<ol>\n<li>(나) — <code>/compact<\/code>는 요약해서 같은 대화를 이어 갑니다.<\/li>\n<li>(가) — <code>!<\/code>는 터미널 명령 실행입니다.<\/li>\n<li>(나) — <code>Esc<\/code>는 멈추기만 합니다.<\/li>\n<\/ol>\n<\/details>\n\n<h2>➡️ 다음 단계<\/h2>\n<p><a href=\"#/lesson/04-claude-md\">4. CLAUDE.md로 규칙 정하기<\/a>에서 매번 같은 설명을 반복하지 않는 방법을 배웁니다.<\/p>\n"},{"id":"04-claude-md","title":"4. CLAUDE.md로 규칙 정하기","order":4,"duration":"25분","lastVerified":"2026-10-12","summary":"CLAUDE.md가 무엇이고 왜 필요한지 · /init으로 자동으로 만들고 고치는 법","html":"<h1>4. CLAUDE.md로 규칙 정하기<\/h1>\n<h2>📌 이 페이지에서 배울 것<\/h2>\n<ul>\n<li>CLAUDE.md가 무엇이고 왜 필요한지<\/li>\n<li><code>/init<\/code>으로 자동으로 만들고 고치는 법<\/li>\n<li>잘 쓴 규칙과 못 쓴 규칙의 차이<\/li>\n<\/ul>\n<p>⏱ 예상 시간: 25분<\/p>\n<hr>\n<h2>4-1. CLAUDE.md란?<\/h2>\n<p>Claude Code는 <strong>새 대화를 시작할 때마다 이전 대화를 기억하지 못합니다.<\/strong> 그래서 &quot;답은 한국어로 해 줘&quot;, &quot;이 프로젝트는 이런 앱이야&quot;를 매번 다시 말해야 합니다.<\/p>\n<p><code>CLAUDE.md<\/code>는 이 문제를 해결하는 <strong>Claude용 안내문<\/strong>입니다. 프로젝트 폴더에 이 파일을 두면, Claude가 <strong>대화를 시작할 때마다 자동으로 읽습니다.<\/strong><\/p>\n<blockquote>\n<p>💡 비유: 새로 온 아르바이트생에게 건네는 <strong>업무 안내 쪽지<\/strong>입니다. 매일 새로 오는 아르바이트생이라도 쪽지만 읽으면 바로 일할 수 있습니다.<\/p>\n<\/blockquote>\n<h3>이럴 때 CLAUDE.md에 적으세요<\/h3>\n<ul>\n<li>Claude가 <strong>같은 실수를 두 번<\/strong> 했을 때<\/li>\n<li>지난 대화에서 했던 설명을 <strong>또 하고 있을 때<\/strong><\/li>\n<li>새로 온 팀원에게도 꼭 알려 줄 내용일 때<\/li>\n<\/ul>\n<hr>\n<h2>4-2. <code>/init<\/code>으로 자동으로 만들기<\/h2>\n<p>직접 처음부터 쓰지 않아도 됩니다.<\/p>\n<pre><code class=\"language-text\">/init\n<\/code><\/pre>\n<p>Claude가 프로젝트를 살펴보고 <code>CLAUDE.md<\/code> 초안을 만들어 줍니다. 실행 명령, 테스트 방법, 발견한 규칙 등이 들어갑니다. 이미 <code>CLAUDE.md<\/code>가 있으면 <strong>덮어쓰지 않고 개선할 점을 제안<\/strong>합니다.<\/p>\n<p>만들어진 뒤에는 <strong>Claude가 코드만 보고는 알 수 없는 내용<\/strong>을 직접 덧붙이세요. 예를 들면 답변 언어, 만들려는 앱의 목적, 피하고 싶은 것 등입니다.<\/p>\n<h3>💻 따라 하기<\/h3>\n<ol>\n<li><code>my-first-project<\/code>에서 <code>/init<\/code> 실행<\/li>\n<li>만들어진 <code>CLAUDE.md<\/code>를 열어 보기<\/li>\n<li>아래 내용을 추가해 달라고 요청하기<\/li>\n<\/ol>\n<pre><code class=\"language-text\">CLAUDE.md에 다음 규칙을 추가해 줘.\n- 설명과 답변은 한국어로 한다.\n- 코딩 초보도 이해할 수 있게 쉽게 설명한다.\n- 작업이 끝나면 무엇을 바꿨는지 3줄로 정리한다.\n<\/code><\/pre>\n<hr>\n<h2>4-3. 무엇을 적을까? (기본 틀)<\/h2>\n<pre><code class=\"language-markdown\"># CLAUDE.md\n\n## 프로젝트 개요\n- 무엇을 만드는지 한두 줄\n- 누가 쓰는지\n\n## 기술 스택\n- 언어, 프레임워크, 패키지 매니저\n\n## 자주 쓰는 명령어\n- 실행: npm run dev\n- 테스트: npm test\n\n## 규칙\n- 지켜야 할 것들 (구체적으로)\n\n## 커뮤니케이션\n- 답변 언어, 설명 수준\n<\/code><\/pre>\n<blockquote>\n<p>📎 부록의 <strong>CLAUDE.md 템플릿<\/strong>을 복사해서 시작해도 됩니다.<\/p>\n<\/blockquote>\n<hr>\n<h2>4-4. 좋은 규칙 vs 나쁜 규칙<\/h2>\n<p>Claude는 CLAUDE.md를 <strong>참고 자료<\/strong>로 읽습니다. 그래서 <strong>구체적이고 확인할 수 있는<\/strong> 규칙일수록 잘 지킵니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>❌ 나쁜 규칙 (애매함)<\/th>\n<th>✅ 좋은 규칙 (구체적)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>코드를 깔끔하게 짜 줘<\/td>\n<td>들여쓰기는 스페이스 2칸<\/td>\n<\/tr>\n<tr>\n<td>테스트를 잘 해 줘<\/td>\n<td>커밋 전에 <code>npm test<\/code>를 실행<\/td>\n<\/tr>\n<tr>\n<td>파일을 정리해서 둬<\/td>\n<td>화면 컴포넌트는 <code>src/components/<\/code>에 둔다<\/td>\n<\/tr>\n<tr>\n<td>친절하게 답해 줘<\/td>\n<td>전문 용어는 처음 나올 때 한 줄로 설명한다<\/td>\n<\/tr>\n<tr>\n<td>좋은 라이브러리를 써<\/td>\n<td>새 라이브러리를 추가하기 전에 이유를 말하고 허락을 받는다<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>잘 쓰는 원칙<\/h3>\n<ul>\n<li><strong>짧게<\/strong>: 파일 하나에 <strong>200줄 이하<\/strong>를 권장합니다. 길수록 Claude가 덜 지킵니다.<\/li>\n<li><strong>제목과 목록으로 정리<\/strong>: 긴 문단보다 <code>##<\/code> 제목과 <code>-<\/code> 목록이 읽기 쉽습니다.<\/li>\n<li><strong>서로 부딪히는 규칙 없애기<\/strong>: &quot;한국어로 답해&quot;와 &quot;영어로 답해&quot;가 같이 있으면 Claude가 아무거나 고를 수 있습니다.<\/li>\n<\/ul>\n<hr>\n<h2>4-5. CLAUDE.md는 어디에 두나?<\/h2>\n<p>위치에 따라 적용 범위가 다릅니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>위치<\/th>\n<th>적용 범위<\/th>\n<th>공유<\/th>\n<th>이럴 때<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>~/.claude/CLAUDE.md<\/code><\/td>\n<td><strong>내 모든 프로젝트<\/strong><\/td>\n<td>나만<\/td>\n<td>&quot;항상 한국어로 답해&quot; 같은 나의 공통 취향<\/td>\n<\/tr>\n<tr>\n<td><code>프로젝트/CLAUDE.md<\/code><\/td>\n<td><strong>이 프로젝트<\/strong><\/td>\n<td>Git으로 팀과 공유<\/td>\n<td>프로젝트 설명, 명령어, 규칙<\/td>\n<\/tr>\n<tr>\n<td><code>프로젝트/CLAUDE.local.md<\/code><\/td>\n<td>이 프로젝트, <strong>나만<\/strong><\/td>\n<td>공유 안 함 (<code>.gitignore<\/code>에 추가)<\/td>\n<td>나만 쓰는 테스트 주소 등<\/td>\n<\/tr>\n<tr>\n<td><code>프로젝트/하위폴더/CLAUDE.md<\/code><\/td>\n<td>그 폴더<\/td>\n<td>Git으로 공유<\/td>\n<td>Claude가 그 폴더의 파일을 다룰 때 추가로 읽음<\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote>\n<p>💡 <code>~<\/code>는 내 사용자 폴더입니다. Windows에서는 <code>C:\\Users\\내이름<\/code>, macOS에서는 <code>/Users/내이름<\/code>입니다.<\/p>\n<\/blockquote>\n<p><strong>여러 파일이 있으면 모두 합쳐서 읽습니다.<\/strong> 덮어쓰는 것이 아니라 차곡차곡 쌓입니다. 내가 작업하는 위치에 <strong>가까운 파일일수록 나중에<\/strong> 읽습니다.<\/p>\n<hr>\n<h2>4-6. CLAUDE.md 편집하고 확인하기<\/h2>\n<table>\n<thead>\n<tr>\n<th>방법<\/th>\n<th>설명<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>/memory<\/code><\/td>\n<td>CLAUDE.md 파일 목록을 보여 주고, 골라서 편집기로 열 수 있음<\/td>\n<\/tr>\n<tr>\n<td>말로 요청<\/td>\n<td>&quot;이 규칙을 CLAUDE.md에 추가해 줘&quot;<\/td>\n<\/tr>\n<tr>\n<td>직접 편집<\/td>\n<td>메모장이나 VS Code로 파일 열기<\/td>\n<\/tr>\n<tr>\n<td><code>/context<\/code><\/td>\n<td>지금 어떤 CLAUDE.md가 읽혔는지 확인<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>자동 메모리와의 차이<\/h3>\n<p>Claude에게 <strong>&quot;앞으로 npm 말고 pnpm을 써. 기억해 둬&quot;<\/strong>라고 말하면, Claude가 스스로 <strong>자동 메모리<\/strong>에 적어 둡니다.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>CLAUDE.md<\/th>\n<th>자동 메모리<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>누가 쓰나<\/td>\n<td><strong>나<\/strong><\/td>\n<td><strong>Claude<\/strong><\/td>\n<\/tr>\n<tr>\n<td>내용<\/td>\n<td>규칙과 지시<\/td>\n<td>Claude가 배운 내 취향, 내가 고쳐 준 것<\/td>\n<\/tr>\n<tr>\n<td>확인<\/td>\n<td>파일을 직접 열어 봄<\/td>\n<td><code>/memory<\/code>에서 자동 메모리 폴더 열기<\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote>\n<p>💡 <strong>꼭 지켜야 하는 규칙<\/strong>은 &quot;기억해 둬&quot;보다 <strong>&quot;CLAUDE.md에 추가해 줘&quot;<\/strong>라고 요청하세요. 직접 보고 고칠 수 있어서 관리하기 쉽습니다.<\/p>\n<\/blockquote>\n<hr>\n<h2>4-7. 효과 확인 실험<\/h2>\n<p>CLAUDE.md가 정말 효과가 있는지 직접 확인해 봅시다.<\/p>\n<ol>\n<li>CLAUDE.md에 이 규칙을 추가합니다.<pre><code class=\"language-text\">- 모든 답변의 마지막 줄에 &quot;🙂 오늘도 화이팅!&quot;을 붙인다.\n<\/code><\/pre>\n<\/li>\n<li><code>/clear<\/code>로 대화를 새로 시작합니다.<\/li>\n<li>아무 질문이나 해 봅니다. 예: &quot;hello.html 설명해 줘&quot;<\/li>\n<li>마지막 줄에 문구가 붙었는지 확인합니다.<\/li>\n<li>확인했으면 이 규칙은 지워 주세요.<\/li>\n<\/ol>\n<hr>\n<h2>✅ 확인하기<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> <code>/init<\/code>으로 CLAUDE.md를 만들었다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 답변 언어와 설명 수준 규칙을 추가했다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>/clear<\/code> 후에도 규칙이 적용되는 것을 확인했다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 애매한 규칙 하나를 구체적인 규칙으로 바꿔 봤다<\/li>\n<\/ul>\n<h2>⚠️ 자주 하는 실수<\/h2>\n<ul>\n<li><strong>너무 길게 쓰기<\/strong>: 모든 것을 적으면 오히려 덜 지킵니다. 매번 꼭 필요한 것만 적으세요.<\/li>\n<li><strong>애매하게 쓰기<\/strong>: &quot;잘&quot;, &quot;깔끔하게&quot;, &quot;적당히&quot;는 피하세요.<\/li>\n<li><strong>비밀 정보 적기<\/strong>: CLAUDE.md는 Git으로 공유될 수 있습니다. 비밀번호, API 키는 절대 적지 마세요.<\/li>\n<li><strong>한 번 쓰고 잊기<\/strong>: 프로젝트가 바뀌면 CLAUDE.md도 업데이트하세요. <code>/doctor prompt-audit<\/code>로 오래되거나 서로 부딪히는 규칙을 점검할 수 있습니다.<\/li>\n<\/ul>\n<h2>🧠 퀴즈<\/h2>\n<ol>\n<li>모든 프로젝트에 &quot;항상 한국어로 답해&quot;를 적용하려면 어디에 적어야 할까?<ul>\n<li>(가) <code>프로젝트/CLAUDE.md<\/code>  (나) <code>~/.claude/CLAUDE.md<\/code>  (다) <code>프로젝트/CLAUDE.local.md<\/code><\/li>\n<\/ul>\n<\/li>\n<li>다음 중 더 좋은 규칙은?<ul>\n<li>(가) &quot;테스트를 잘 해 줘&quot;  (나) &quot;커밋 전에 <code>npm test<\/code>를 실행한다&quot;<\/li>\n<\/ul>\n<\/li>\n<li><code>/clear<\/code>를 하면 CLAUDE.md 규칙은?<ul>\n<li>(가) 사라진다  (나) 새 대화에서도 다시 읽는다<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<details>\n<summary>정답 보기<\/summary>\n\n<ol>\n<li>(나) — 내 사용자 폴더의 CLAUDE.md는 모든 프로젝트에 적용됩니다.<\/li>\n<li>(나) — 무엇을 해야 하는지 구체적이고 확인할 수 있습니다.<\/li>\n<li>(나) — CLAUDE.md는 대화를 시작할 때마다 읽습니다.<\/li>\n<\/ol>\n<\/details>\n\n<h2>➡️ 다음 단계<\/h2>\n<p><a href=\"#/lesson/05-prompting\">5. 잘 시키는 법<\/a>에서 원하는 결과를 한 번에 얻는 요청 방법을 배웁니다.<\/p>\n"},{"id":"05-prompting","title":"5. 잘 시키는 법","order":5,"duration":"30분","lastVerified":"2026-10-12","summary":"원하는 결과를 얻는 요청의 5가지 원칙 · 계획 모드로 \"먼저 계획, 나중에 실행\"하기","html":"<h1>5. 잘 시키는 법 (프롬프트)<\/h1>\n<h2>📌 이 페이지에서 배울 것<\/h2>\n<ul>\n<li>원하는 결과를 얻는 요청의 5가지 원칙<\/li>\n<li>계획 모드로 &quot;먼저 계획, 나중에 실행&quot;하기<\/li>\n<li>에러가 나거나 결과가 마음에 안 들 때 대처법<\/li>\n<\/ul>\n<p>⏱ 예상 시간: 30분<\/p>\n<hr>\n<h2>5-1. 왜 요청 방법이 중요할까?<\/h2>\n<p>Claude는 <strong>내 머릿속을 볼 수 없습니다.<\/strong> &quot;예쁘게 만들어 줘&quot;라고 하면, Claude가 생각하는 &quot;예쁨&quot;으로 만듭니다.<\/p>\n<blockquote>\n<p>💡 비유: 처음 만난 인테리어 기사님에게 &quot;집 좀 예쁘게 해 주세요&quot;라고 하는 것과 &quot;거실 벽을 연한 회색으로 칠하고, 소파 위에 선반 하나 달아 주세요&quot;라고 하는 것의 차이입니다.<\/p>\n<\/blockquote>\n<hr>\n<h2>5-2. 5가지 원칙<\/h2>\n<h3>① 구체적으로<\/h3>\n<p>무엇을, 어디에, 어떻게를 말합니다.<\/p>\n<ul>\n<li>❌ &quot;버튼 추가해 줘&quot;<\/li>\n<li>✅ &quot;<code>hello.html<\/code> 제목 아래에 &#39;연락하기&#39; 버튼을 추가하고, 누르면 내 이메일로 메일 쓰기 창이 열리게 해 줘&quot;<\/li>\n<\/ul>\n<h3>② 작게 나눠서<\/h3>\n<p>큰 일은 단계로 나눠서 하나씩 시킵니다. 한 단계가 잘 되는지 확인하고 다음으로 갑니다.<\/p>\n<ul>\n<li>❌ &quot;쇼핑몰 만들어 줘&quot;<\/li>\n<li>✅ &quot;먼저 상품 5개를 카드 모양으로 보여 주는 목록 페이지만 만들어 줘. 장바구니는 다음에 할게&quot;<\/li>\n<\/ul>\n<h3>③ 목표와 조건을 함께<\/h3>\n<p>왜 필요한지, 지켜야 할 것은 무엇인지 알려 줍니다.<\/p>\n<ul>\n<li>❌ &quot;로그인 기능 만들어 줘&quot;<\/li>\n<li>✅ &quot;가족끼리만 쓰는 메모 앱이라 복잡한 회원가입은 필요 없어. 비밀번호 하나만 입력하면 들어가지게 해 줘. 새 라이브러리는 쓰지 마&quot;<\/li>\n<\/ul>\n<h3>④ 예시 보여 주기<\/h3>\n<p>말로 설명하기 어려우면 예시를 줍니다. 원하는 모양의 <strong>스크린샷을 붙여 넣는 것<\/strong>도 좋은 방법입니다.<\/p>\n<ul>\n<li>✅ &quot;날짜는 <code>2026년 10월 12일 (일)<\/code>처럼 보여 줘&quot;<\/li>\n<li>✅ <code>[이미지]<\/code> &quot;이 사이트처럼 위쪽에 메뉴 막대를 만들어 줘&quot;<\/li>\n<\/ul>\n<h3>⑤ 확인 방법 알려 주기<\/h3>\n<p>&quot;다 됐어요&quot;가 아니라 <strong>진짜 되는지<\/strong> 확인하게 합니다.<\/p>\n<ul>\n<li>✅ &quot;다 만들면 브라우저에서 열어서 버튼이 잘 동작하는지 확인해 줘&quot;<\/li>\n<li>✅ &quot;고친 뒤에 <code>npm test<\/code>를 실행해서 모두 통과하는지 확인해 줘&quot;<\/li>\n<\/ul>\n<hr>\n<h2>5-3. 나쁜 요청 vs 좋은 요청 10쌍<\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>❌ 나쁜 요청<\/th>\n<th>✅ 좋은 요청<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>앱 만들어 줘<\/td>\n<td>할 일을 추가·삭제할 수 있는 웹페이지를 HTML 파일 하나로 만들어 줘<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>예쁘게 해 줘<\/td>\n<td>배경은 흰색, 글자는 진한 회색, 버튼은 둥근 모서리의 파란색으로 해 줘<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>이거 고쳐 줘<\/td>\n<td><code>@app.js<\/code> 저장 버튼을 눌러도 목록에 안 나타나. 원인을 찾아서 고쳐 줘<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>에러 나<\/td>\n<td>(에러 메시지를 그대로 붙여 넣고) 이 에러가 나. 원인을 설명하고 고쳐 줘<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>더 좋게 만들어 줘<\/td>\n<td>목록이 100개 넘으면 느려져. 한 번에 20개씩 보이게 바꿔 줘<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>코드 정리해 줘<\/td>\n<td><code>@app.js<\/code>에서 같은 코드가 반복되는 부분을 함수 하나로 합쳐 줘. 동작은 바꾸지 마<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>모바일도 되게<\/td>\n<td>폰 화면(가로 400px)에서도 글자가 잘리지 않게 해 줘<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>테스트 해 줘<\/td>\n<td>할 일 추가 기능에 대한 테스트를 만들고 실행해서 결과를 알려 줘<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>이 코드 뭐야?<\/td>\n<td><code>@app.js<\/code>가 하는 일을 초보자가 이해할 수 있게 순서대로 설명해 줘<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>다 알아서 해<\/td>\n<td>먼저 어떻게 만들지 계획만 보여 줘. 내가 확인한 뒤에 시작해<\/td>\n<\/tr>\n<\/tbody><\/table>\n<hr>\n<h2>5-4. 계획 모드: 먼저 계획, 나중에 실행<\/h2>\n<p>큰 작업은 바로 시키지 말고 <strong>계획부터 보세요.<\/strong> 계획 모드에서는 Claude가 파일을 읽고 조사만 하고, <strong>코드는 고치지 않습니다.<\/strong><\/p>\n<h3>계획 모드 쓰는 법<\/h3>\n<p><strong>방법 1<\/strong>: 요청 앞에 <code>/plan<\/code>을 붙입니다.<\/p>\n<pre><code class=\"language-text\">/plan 할 일 목록에 마감 날짜 기능을 추가하고 싶어\n<\/code><\/pre>\n<p><strong>방법 2<\/strong>: <code>Shift + Tab<\/code>을 눌러 상태 표시줄이 <code>⏸ plan mode on<\/code>이 될 때까지 바꾼 뒤 요청합니다.<\/p>\n<h3>계획이 나오면<\/h3>\n<p>Claude가 계획을 보여 주고 어떻게 할지 묻습니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>선택<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Yes, and use auto mode<\/strong><\/td>\n<td>계획대로 진행. 묻지 않고 자동으로 작업<\/td>\n<\/tr>\n<tr>\n<td><strong>Yes, manually approve edits<\/strong><\/td>\n<td>계획대로 진행. 파일을 고칠 때마다 확인<\/td>\n<\/tr>\n<tr>\n<td><strong>No, keep planning<\/strong><\/td>\n<td>계획 수정. 바꾸고 싶은 점을 말해 줌<\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote>\n<p>💡 초보자에게는 <strong>Yes, manually approve edits<\/strong>를 추천합니다. 계획과 실제 작업을 하나씩 비교하며 배울 수 있습니다.<\/p>\n<\/blockquote>\n<blockquote>\n<p>💡 <code>Ctrl + G<\/code>를 누르면 계획을 편집기로 열어서 직접 고칠 수도 있습니다.<\/p>\n<\/blockquote>\n<h3>💻 따라 하기<\/h3>\n<pre><code class=\"language-text\">/plan hello.html에 다크 모드 전환 버튼을 넣고 싶어. 어떻게 할지 계획을 보여 줘.\n<\/code><\/pre>\n<p>계획을 읽어 보고, 마음에 안 드는 부분이 있으면 <strong>No, keep planning<\/strong>을 고른 뒤 고칠 점을 말해 보세요.<\/p>\n<hr>\n<h2>5-5. 에러가 났을 때<\/h2>\n<p><strong>에러 메시지를 요약하지 말고 그대로 붙여 넣으세요.<\/strong> Claude에게는 에러 메시지 전체가 중요한 단서입니다.<\/p>\n<pre><code class=\"language-text\">브라우저에서 버튼을 누르면 아무 반응이 없고, 개발자 도구 콘솔에 이렇게 나와.\n\nUncaught TypeError: Cannot read properties of null (reading &#39;addEventListener&#39;)\n    at app.js:12\n\n원인을 설명하고 고쳐 줘.\n<\/code><\/pre>\n<p><strong>잘 알려 주는 3가지<\/strong><\/p>\n<ol>\n<li><strong>무엇을 했는지<\/strong>: &quot;저장 버튼을 눌렀더니&quot;<\/li>\n<li><strong>무엇을 기대했는지<\/strong>: &quot;목록에 추가될 줄 알았는데&quot;<\/li>\n<li><strong>실제로 무슨 일이 있었는지<\/strong>: &quot;아무 일도 안 일어나고 콘솔에 이 에러가 나와&quot;<\/li>\n<\/ol>\n<blockquote>\n<p>💡 브라우저 개발자 도구는 <code>F12<\/code>(macOS는 <code>Cmd + Option + I<\/code>)로 열고, <strong>Console<\/strong> 탭에서 에러를 볼 수 있습니다.<\/p>\n<\/blockquote>\n<hr>\n<h2>5-6. 결과가 마음에 안 들 때<\/h2>\n<table>\n<thead>\n<tr>\n<th>상황<\/th>\n<th>이렇게 하세요<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>조금 아쉬움<\/td>\n<td>바꿀 점만 구체적으로 다시 요청: &quot;버튼 색만 초록색으로&quot;<\/td>\n<\/tr>\n<tr>\n<td>방향이 완전히 틀림<\/td>\n<td><code>Esc<\/code>로 멈추고 <code>/rewind<\/code>로 되돌린 뒤, 더 구체적으로 다시 요청<\/td>\n<\/tr>\n<tr>\n<td>같은 실수를 반복함<\/td>\n<td>그 규칙을 <strong>CLAUDE.md에 추가<\/strong> (4장)<\/td>\n<\/tr>\n<tr>\n<td>대화가 꼬임<\/td>\n<td><code>/clear<\/code>로 새로 시작하고, 지금까지 정한 내용을 정리해서 다시 요청<\/td>\n<\/tr>\n<tr>\n<td>내가 뭘 원하는지 모르겠음<\/td>\n<td>&quot;선택지 3가지를 보여 줘. 각각 장단점도 알려 줘&quot;<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>질문을 시켜 보세요<\/h3>\n<p>요구사항이 애매하면, Claude에게 <strong>먼저 질문하라고<\/strong> 할 수 있습니다.<\/p>\n<pre><code class=\"language-text\">가계부 앱을 만들고 싶어. 시작하기 전에 나한테 필요한 질문을 5개만 해 줘.\n<\/code><\/pre>\n<hr>\n<h2>✅ 확인하기<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 나쁜 요청 하나를 5원칙에 맞게 고쳐 써 봤다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>/plan<\/code>으로 계획을 받아 보고, 한 번은 <strong>No, keep planning<\/strong>으로 고쳐 봤다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 에러 메시지를 그대로 붙여 넣어 고쳐 달라고 해 봤다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> &quot;먼저 질문해 줘&quot;로 요구사항을 정리해 봤다<\/li>\n<\/ul>\n<h2>⚠️ 자주 하는 실수<\/h2>\n<ul>\n<li><strong>한 번에 너무 많이 시키기<\/strong>: 결과가 엉키고 확인하기 어렵습니다. 하나씩!<\/li>\n<li><strong>에러를 요약해서 말하기<\/strong>: &quot;뭔가 에러 나&quot;보다 메시지 전체를 붙여 넣으세요.<\/li>\n<li><strong>결과를 확인하지 않고 다음으로 넘어가기<\/strong>: 단계마다 직접 열어서 확인하세요.<\/li>\n<li><strong>같은 말을 계속 반복하기<\/strong>: 세 번째쯤 같은 요청을 하고 있다면 <code>/clear<\/code> 후 처음부터 정리해서 요청하세요.<\/li>\n<\/ul>\n<h2>🧠 퀴즈<\/h2>\n<ol>\n<li>큰 기능을 만들 때 가장 좋은 첫 단계는?<ul>\n<li>(가) 한 번에 다 만들어 달라고 한다  (나) <code>/plan<\/code>으로 계획부터 본다  (다) 모델을 바꾼다<\/li>\n<\/ul>\n<\/li>\n<li>에러가 났을 때 가장 좋은 방법은?<ul>\n<li>(가) &quot;에러 나&quot;라고만 말한다  (나) 에러 메시지를 그대로 붙여 넣는다  (다) 다시 설치한다<\/li>\n<\/ul>\n<\/li>\n<li>계획 모드에서 Claude는?<ul>\n<li>(가) 바로 코드를 고친다  (나) 조사하고 계획만 세운다<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<details>\n<summary>정답 보기<\/summary>\n\n<ol>\n<li>(나)<\/li>\n<li>(나) — 에러 메시지 전체가 원인을 찾는 단서입니다.<\/li>\n<li>(나) — 계획을 승인하기 전에는 코드를 고치지 않습니다.<\/li>\n<\/ol>\n<\/details>\n\n<h2>➡️ 다음 단계<\/h2>\n<p><a href=\"#/lesson/06-safety\">6. 안전하게 쓰기<\/a>에서 권한 모드와 되돌리기, 비밀 정보 지키는 법을 배웁니다.<\/p>\n"},{"id":"06-safety","title":"6. 안전하게 쓰기","order":6,"duration":"30분","lastVerified":"2026-10-12","summary":"권한 모드 4가지와 언제 어떤 모드를 쓸지 · 허용·차단 규칙을 정하는 법","html":"<h1>6. 안전하게 쓰기 (권한·되돌리기)<\/h1>\n<h2>📌 이 페이지에서 배울 것<\/h2>\n<ul>\n<li>권한 모드 4가지와 언제 어떤 모드를 쓸지<\/li>\n<li>허용·차단 규칙을 정하는 법<\/li>\n<li>실수했을 때 되돌리는 법과 그 한계<\/li>\n<li>비밀 정보를 지키는 법<\/li>\n<\/ul>\n<p>⏱ 예상 시간: 30분<\/p>\n<hr>\n<h2>6-1. 왜 안전이 중요할까?<\/h2>\n<p>Claude Code는 내 컴퓨터에서 <strong>파일을 만들고, 고치고, 지우고, 명령을 실행할 수 있습니다.<\/strong> 아주 편리하지만, 잘못된 요청이나 실수 하나로 중요한 파일이 바뀌거나 사라질 수도 있습니다.<\/p>\n<blockquote>\n<p>💡 비유: 집 열쇠를 맡긴 도우미입니다. 믿을 만하지만, <strong>어느 방까지 들어가도 되는지<\/strong>는 내가 정해야 합니다.<\/p>\n<\/blockquote>\n<hr>\n<h2>6-2. 권한 모드 4가지<\/h2>\n<p><code>Shift + Tab<\/code>을 누를 때마다 모드가 바뀌고, 입력창 아래 상태 표시줄에 지금 모드가 나옵니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>모드<\/th>\n<th>상태 표시줄<\/th>\n<th>묻지 않고 하는 일<\/th>\n<th>이럴 때<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>수동 (Manual)<\/strong><\/td>\n<td><code>⏸ manual mode on<\/code><\/td>\n<td>파일 읽기만<\/td>\n<td>처음 배울 때, 중요한 프로젝트 ⭐<\/td>\n<\/tr>\n<tr>\n<td><strong>수정 자동 허용<\/strong><\/td>\n<td><code>⏵⏵ accept edits on<\/code><\/td>\n<td>읽기 + 파일 수정 + <code>mkdir<\/code>·<code>mv<\/code>·<code>cp<\/code> 같은 기본 파일 명령<\/td>\n<td>결과를 나중에 한꺼번에 확인할 때<\/td>\n<\/tr>\n<tr>\n<td><strong>계획 (Plan)<\/strong><\/td>\n<td><code>⏸ plan mode on<\/code><\/td>\n<td>읽기와 조사만. <strong>코드는 안 고침<\/strong><\/td>\n<td>큰 작업 전에 계획 세울 때 (5장)<\/td>\n<\/tr>\n<tr>\n<td><strong>자동 (Auto)<\/strong><\/td>\n<td><code>⏵⏵ auto mode on<\/code><\/td>\n<td>거의 모든 일. 대신 안전 검사기가 위험한 작업을 막음<\/td>\n<td>익숙해진 뒤, 방향이 확실한 긴 작업<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>순서<\/strong>: 자동 → 수동 → 수정 자동 허용 → 계획 → 다시 자동<\/p>\n<blockquote>\n<p>💡 최신 버전은 <strong>자동 모드로 시작<\/strong>합니다. 처음 배울 때는 <code>Shift + Tab<\/code>으로 <strong>수동 모드<\/strong>로 바꾸는 것을 추천합니다.<\/p>\n<\/blockquote>\n<h3>자동 모드를 쓸 때 알아 둘 것<\/h3>\n<ul>\n<li>별도의 <strong>안전 검사기<\/strong>가 내 요청을 벗어나거나 위험해 보이는 작업을 막습니다. 하지만 <strong>완벽한 안전장치는 아닙니다.<\/strong><\/li>\n<li>대화에서 <strong>&quot;푸시하지 마&quot;<\/strong>, <strong>&quot;배포 전에 나한테 확인받아&quot;<\/strong>처럼 말하면 검사기가 그 경계를 지키려고 합니다.<\/li>\n<li>다만 대화가 길어져 요약(<code>/compact<\/code>)되면 그 말이 사라질 수 있습니다. <strong>반드시 지켜야 하는 것은 6-3의 차단 규칙<\/strong>으로 정하세요.<\/li>\n<\/ul>\n<blockquote>\n<p>⚠️ <code>bypassPermissions<\/code>(모든 확인 건너뛰기)라는 모드도 있지만, <strong>격리된 테스트 환경 전용<\/strong>입니다. 초보자는 쓰지 마세요.<\/p>\n<\/blockquote>\n<hr>\n<h2>6-3. 허용·차단 규칙 정하기: <code>/permissions<\/code><\/h2>\n<p>자주 쓰는 안전한 명령은 <strong>매번 묻지 않게<\/strong>, 위험한 일은 <strong>아예 못 하게<\/strong> 정할 수 있습니다.<\/p>\n<pre><code class=\"language-text\">/permissions\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>규칙<\/th>\n<th>뜻<\/th>\n<th>예시<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Allow<\/strong> (허용)<\/td>\n<td>묻지 않고 실행<\/td>\n<td><code>npm run<\/code>으로 시작하는 명령<\/td>\n<\/tr>\n<tr>\n<td><strong>Ask<\/strong> (확인)<\/td>\n<td>항상 물어봄<\/td>\n<td><code>git push<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Deny<\/strong> (차단)<\/td>\n<td>절대 못 함<\/td>\n<td><code>.env<\/code> 파일 읽기<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>우선순위<\/strong>: 차단 → 확인 → 허용 순서로 검사합니다. <strong>차단 규칙은 어떤 모드에서도 이깁니다.<\/strong><\/p>\n<h3>설정 파일로 정하기<\/h3>\n<p>규칙은 <code>.claude/settings.json<\/code> 파일에 저장됩니다. Claude에게 말로 시켜도 됩니다.<\/p>\n<pre><code class=\"language-json\">{\n  &quot;permissions&quot;: {\n    &quot;allow&quot;: [&quot;Bash(npm run *)&quot;],\n    &quot;ask&quot;: [&quot;Bash(git push *)&quot;],\n    &quot;deny&quot;: [&quot;Read(./.env)&quot;, &quot;Read(./secrets/**)&quot;]\n  }\n}\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>규칙<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>Bash(npm run *)<\/code><\/td>\n<td><code>npm run build<\/code>, <code>npm run test<\/code> 등 <code>npm run<\/code>으로 시작하는 명령<\/td>\n<\/tr>\n<tr>\n<td><code>Bash(git push *)<\/code><\/td>\n<td><code>git push<\/code>로 시작하는 명령<\/td>\n<\/tr>\n<tr>\n<td><code>Read(./.env)<\/code><\/td>\n<td>현재 폴더의 <code>.env<\/code> 파일 읽기<\/td>\n<\/tr>\n<tr>\n<td><code>Read(./secrets/**)<\/code><\/td>\n<td><code>secrets<\/code> 폴더 안의 모든 파일 읽기<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>💻 따라 하기<\/h3>\n<pre><code class=\"language-text\">/update-config .env 파일은 절대 읽지 못하게 하고, git push는 항상 나한테 물어보게 설정해 줘\n<\/code><\/pre>\n<blockquote>\n<p>💡 수동 모드에서 터미널 명령이나 웹사이트 접근에 <strong>&quot;Yes, and don&#39;t ask again&quot;<\/strong>을 고르면, 그 허용 규칙이 <code>.claude/settings.local.json<\/code>에 저장되어 다음 대화에도 적용됩니다. (파일 수정 허용은 이번 대화에서만 유지됩니다.) 나중에 <code>/permissions<\/code>에서 확인하고 지울 수 있습니다.<\/p>\n<\/blockquote>\n<hr>\n<h2>6-4. 되돌리기: <code>/rewind<\/code> 자세히<\/h2>\n<p><code>/rewind<\/code>를 입력하거나 <strong>빈 입력창에서 <code>Esc<\/code>를 두 번<\/strong> 누르면 되돌리기 메뉴가 열립니다. 내가 보냈던 메시지 목록에서 시점을 고른 뒤, 할 일을 선택합니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>선택<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Restore code and conversation<\/strong><\/td>\n<td>코드와 대화 모두 그 시점으로<\/td>\n<\/tr>\n<tr>\n<td><strong>Restore conversation<\/strong><\/td>\n<td>대화만 되돌리고 코드는 그대로<\/td>\n<\/tr>\n<tr>\n<td><strong>Restore code<\/strong><\/td>\n<td>코드만 되돌리고 대화는 그대로<\/td>\n<\/tr>\n<tr>\n<td><strong>Summarize from here<\/strong><\/td>\n<td>그 시점 이후 대화를 요약해서 공간 확보<\/td>\n<\/tr>\n<tr>\n<td><strong>Never mind<\/strong><\/td>\n<td>취소<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>⚠️ 되돌리기의 한계<\/h3>\n<p><code>/rewind<\/code>는 Claude가 <strong>파일 편집 기능으로 직접 고친 파일<\/strong>만 되돌립니다. 아래는 되돌리지 <strong>못합니다.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>되돌릴 수 없는 것<\/th>\n<th>예시<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Claude가 <strong>터미널 명령<\/strong>으로 바꾼 파일<\/td>\n<td><code>rm<\/code>으로 지운 파일, <code>mv<\/code>로 옮긴 파일<\/td>\n<\/tr>\n<tr>\n<td>내가 <strong>직접<\/strong> 고친 파일<\/td>\n<td>메모장으로 고친 내용<\/td>\n<\/tr>\n<tr>\n<td>외부에 보낸 것<\/td>\n<td>GitHub에 푸시한 것, 보낸 메시지<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>그리고 되돌리기 기록은 <strong>약 30일 뒤 자동으로 지워집니다.<\/strong><\/p>\n<blockquote>\n<p>💡 <strong>진짜 안전망은 Git입니다.<\/strong> 중요한 작업 전에 &quot;지금 상태를 커밋해 줘&quot;라고 하세요. Git 커밋은 지워지지 않고 언제든 돌아갈 수 있습니다. (7장)<\/p>\n<\/blockquote>\n<hr>\n<h2>6-5. <code>/diff<\/code>로 확인하는 습관<\/h2>\n<p>Claude가 무엇을 바꿨는지 <strong>한눈에<\/strong> 볼 수 있습니다.<\/p>\n<pre><code class=\"language-text\">/diff\n<\/code><\/pre>\n<p><strong>작업이 끝날 때마다<\/strong> 확인하세요.<\/p>\n<ul>\n<li>요청하지 않은 파일이 바뀌지 않았는지<\/li>\n<li>지워지면 안 되는 내용이 지워지지 않았는지<\/li>\n<li>비밀 정보가 코드에 들어가지 않았는지<\/li>\n<\/ul>\n<hr>\n<h2>6-6. 비밀 정보 지키기<\/h2>\n<p><strong>API 키, 비밀번호, 토큰<\/strong>은 코드에 직접 쓰면 안 됩니다. GitHub에 올라가면 전 세계 누구나 볼 수 있습니다.<\/p>\n<h3>올바른 방법: <code>.env<\/code> 파일<\/h3>\n<p><strong>① 비밀 정보는 <code>.env<\/code> 파일에 따로 둡니다<\/strong><\/p>\n<pre><code class=\"language-text\">WEATHER_API_KEY=여기에_실제_키\n<\/code><\/pre>\n<p><strong>② <code>.gitignore<\/code>에 <code>.env<\/code>를 추가해서 GitHub에 올라가지 않게 합니다<\/strong><\/p>\n<pre><code class=\"language-text\">.env\n<\/code><\/pre>\n<p><strong>③ 다른 사람을 위해 <code>.env.example<\/code>에 이름만 적어 둡니다<\/strong><\/p>\n<pre><code class=\"language-text\">WEATHER_API_KEY=\n<\/code><\/pre>\n<p><strong>④ Claude가 <code>.env<\/code>를 읽지 못하게 차단 규칙을 추가합니다<\/strong> (6-3)<\/p>\n<h3>💻 따라 하기<\/h3>\n<pre><code class=\"language-text\">이 프로젝트에 .gitignore를 만들고 .env를 추가해 줘. .env.example도 만들어 줘.\n<\/code><\/pre>\n<blockquote>\n<p>⚠️ <strong>채팅창에 API 키를 붙여 넣지 마세요.<\/strong> 대화 기록에 남습니다. <code>.env<\/code> 파일에 직접 입력하세요.<\/p>\n<\/blockquote>\n<hr>\n<h2>6-7. 조심해야 할 요청<\/h2>\n<p>이런 요청은 실행 전에 <strong>한 번 더 생각<\/strong>하고, 수동 모드나 계획 모드로 하세요.<\/p>\n<table>\n<thead>\n<tr>\n<th>위험한 요청<\/th>\n<th>왜 위험한가<\/th>\n<th>더 안전한 방법<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>&quot;필요 없는 파일 다 지워 줘&quot;<\/td>\n<td>필요한 파일까지 지울 수 있음<\/td>\n<td>&quot;지울 후보 목록만 먼저 보여 줘&quot;<\/td>\n<\/tr>\n<tr>\n<td>&quot;인터넷에서 찾은 이 스크립트 실행해 줘&quot;<\/td>\n<td>무슨 일을 할지 모름<\/td>\n<td>&quot;이 스크립트가 무슨 일을 하는지 먼저 설명해 줘&quot;<\/td>\n<\/tr>\n<tr>\n<td>&quot;다른 폴더의 파일도 고쳐 줘&quot;<\/td>\n<td>작업 폴더 밖까지 영향<\/td>\n<td>그 폴더에서 따로 <code>claude<\/code> 실행<\/td>\n<\/tr>\n<tr>\n<td>&quot;에러 안 나게 아무렇게나 고쳐 줘&quot;<\/td>\n<td>문제를 숨기기만 할 수 있음<\/td>\n<td>&quot;원인을 먼저 설명하고 고쳐 줘&quot;<\/td>\n<\/tr>\n<tr>\n<td>&quot;강제로 푸시해 줘&quot;<\/td>\n<td>다른 사람의 작업이 사라질 수 있음<\/td>\n<td>7장의 방법으로 차근차근<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>모르는 폴더를 열 때<\/h3>\n<p>다른 사람에게 받은 프로젝트에는 Claude가 따르는 설정 파일(<code>CLAUDE.md<\/code>, <code>.claude/<\/code>)이 들어 있을 수 있습니다. 처음 실행할 때 <strong>이 폴더를 믿을지<\/strong> 물어보면, 출처를 알 때만 허용하세요.<\/p>\n<hr>\n<h2>✅ 확인하기<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> <code>Shift + Tab<\/code>으로 4가지 모드를 모두 바꿔 봤다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>/permissions<\/code>를 열어 규칙 목록을 확인했다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>.env<\/code> 읽기 차단 규칙을 추가했다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>/rewind<\/code>로 코드만 되돌려 봤다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 작업 후 <code>/diff<\/code>로 변경 내용을 확인했다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>.gitignore<\/code>에 <code>.env<\/code>를 추가했다<\/li>\n<\/ul>\n<h2>⚠️ 자주 하는 실수<\/h2>\n<ul>\n<li><strong>자동 모드면 무조건 안전하다고 믿기<\/strong>: 검사기는 도움이 되지만 완벽하지 않습니다. 중요한 작업은 확인하세요.<\/li>\n<li><strong><code>/rewind<\/code>만 믿기<\/strong>: 터미널 명령으로 지운 파일은 돌아오지 않습니다. Git 커밋을 함께 쓰세요.<\/li>\n<li><strong>&quot;Yes, and don&#39;t ask again&quot;을 습관적으로 누르기<\/strong>: 무엇을 영구 허용하는지 읽고 누르세요.<\/li>\n<li><strong>API 키를 코드나 채팅에 붙여 넣기<\/strong>: 반드시 <code>.env<\/code>에.<\/li>\n<\/ul>\n<h2>🧠 퀴즈<\/h2>\n<ol>\n<li>처음 배울 때 추천하는 권한 모드는?<ul>\n<li>(가) 자동  (나) 수동  (다) bypassPermissions<\/li>\n<\/ul>\n<\/li>\n<li>허용 규칙과 차단 규칙이 부딪히면?<ul>\n<li>(가) 허용이 이긴다  (나) 차단이 이긴다  (다) 나중에 쓴 것이 이긴다<\/li>\n<\/ul>\n<\/li>\n<li>Claude가 <code>rm<\/code> 명령으로 지운 파일을 <code>/rewind<\/code>로 되돌릴 수 있을까?<ul>\n<li>(가) 있다  (나) 없다<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<details>\n<summary>정답 보기<\/summary>\n\n<ol>\n<li>(나) — 무엇을 하는지 보면서 배울 수 있습니다.<\/li>\n<li>(나) — 차단 → 확인 → 허용 순서로 검사합니다.<\/li>\n<li>(나) — 터미널 명령으로 바뀐 파일은 추적되지 않습니다. Git으로 대비하세요.<\/li>\n<\/ol>\n<\/details>\n\n<h2>➡️ 다음 단계<\/h2>\n<p><a href=\"#/lesson/07-git-github\">7. Git·GitHub와 함께 쓰기<\/a>에서 지워지지 않는 진짜 안전망, Git을 배웁니다.<\/p>\n"},{"id":"07-git-github","title":"7. Git·GitHub와 함께 쓰기","order":7,"duration":"35분","lastVerified":"2026-10-12","summary":"Git이 왜 필요한지와 꼭 알아야 할 용어 5개 · Claude에게 말로 커밋·브랜치·PR을 시키는 법","html":"<h1>7. Git·GitHub와 함께 쓰기<\/h1>\n<h2>📌 이 페이지에서 배울 것<\/h2>\n<ul>\n<li>Git이 왜 필요한지와 꼭 알아야 할 용어 5개<\/li>\n<li>Claude에게 말로 커밋·브랜치·PR을 시키는 법<\/li>\n<li>GitHub와 Claude를 연결하고, 웹(클라우드)에서 작업하는 법<\/li>\n<\/ul>\n<p>⏱ 예상 시간: 35분<\/p>\n<hr>\n<h2>7-1. Git이 왜 필요할까?<\/h2>\n<p>Git은 <strong>게임의 세이브 포인트<\/strong>입니다. 저장해 두면 언제든 그 시점으로 돌아갈 수 있습니다.<\/p>\n<p>6장에서 배운 <code>/rewind<\/code>는 편리하지만 한계가 있었습니다. 터미널 명령으로 지운 파일은 되돌리지 못하고, 약 30일 뒤 기록이 지워집니다. <strong>Git 커밋은 직접 지우지 않는 한 영원히 남고, 무엇이든 되돌릴 수 있습니다.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><code>/rewind<\/code><\/th>\n<th>Git 커밋<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>되돌릴 수 있는 것<\/td>\n<td>Claude가 편집한 파일<\/td>\n<td>저장한 시점의 모든 파일<\/td>\n<\/tr>\n<tr>\n<td>기간<\/td>\n<td>약 30일<\/td>\n<td>영구<\/td>\n<\/tr>\n<tr>\n<td>다른 사람과 공유<\/td>\n<td>불가<\/td>\n<td>GitHub로 공유 가능<\/td>\n<\/tr>\n<\/tbody><\/table>\n<hr>\n<h2>7-2. 꼭 알아야 할 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>쉬운 뜻<\/th>\n<th>비유<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>저장소 (Repository)<\/strong><\/td>\n<td>Git이 관리하는 프로젝트 폴더<\/td>\n<td>세이브 파일이 들어 있는 게임 폴더<\/td>\n<\/tr>\n<tr>\n<td><strong>커밋 (Commit)<\/strong><\/td>\n<td>지금 상태를 저장한 것<\/td>\n<td>세이브 포인트<\/td>\n<\/tr>\n<tr>\n<td><strong>브랜치 (Branch)<\/strong><\/td>\n<td>원본을 건드리지 않고 따로 작업하는 갈래<\/td>\n<td>평행 세계<\/td>\n<\/tr>\n<tr>\n<td><strong>푸시 (Push)<\/strong><\/td>\n<td>내 커밋을 GitHub에 올리기<\/td>\n<td>클라우드 백업<\/td>\n<\/tr>\n<tr>\n<td><strong>PR (Pull Request)<\/strong><\/td>\n<td>&quot;내 브랜치 작업을 원본에 합쳐 주세요&quot;라는 요청<\/td>\n<td>결재 올리기<\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote>\n<p>💡 <strong>GitHub<\/strong>는 Git 저장소를 인터넷에 올려 두는 서비스입니다. Git은 프로그램, GitHub는 웹사이트입니다.<\/p>\n<\/blockquote>\n<hr>\n<h2>7-3. 처음 한 번만: Git 설치와 설정<\/h2>\n<p><strong>① Git 설치<\/strong><\/p>\n<ul>\n<li>Windows: 2장에서 설치한 <strong>Git for Windows<\/strong>에 포함되어 있습니다.<\/li>\n<li>macOS: 터미널에서 <code>git --version<\/code>을 입력하면 설치 안내가 나옵니다.<\/li>\n<li>확인: <code>git --version<\/code>을 입력해서 버전 번호가 나오면 됩니다.<\/li>\n<\/ul>\n<p><strong>② 내 이름과 이메일 등록<\/strong> (커밋에 기록됩니다)<\/p>\n<pre><code class=\"language-bash\">git config --global user.name &quot;홍길동&quot;\ngit config --global user.email &quot;내GitHub이메일@example.com&quot;\n<\/code><\/pre>\n<p><strong>③ GitHub 계정 만들기<\/strong>: <a href=\"https://github.com\">https://github.com<\/a> 에서 가입합니다.<\/p>\n<hr>\n<h2>7-4. Claude에게 말로 시키기<\/h2>\n<p>Git 명령어를 외울 필요는 없습니다. Claude에게 말로 하면 됩니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>하고 싶은 것<\/th>\n<th>Claude에게 이렇게<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Git 시작<\/td>\n<td>&quot;이 폴더를 Git 저장소로 만들어 줘&quot;<\/td>\n<\/tr>\n<tr>\n<td>저장<\/td>\n<td>&quot;지금까지 바꾼 내용을 커밋해 줘&quot;<\/td>\n<\/tr>\n<tr>\n<td>상태 확인<\/td>\n<td>&quot;아직 커밋 안 한 변경 사항 보여 줘&quot;<\/td>\n<\/tr>\n<tr>\n<td>기록 보기<\/td>\n<td>&quot;최근 커밋 5개를 쉽게 설명해 줘&quot;<\/td>\n<\/tr>\n<tr>\n<td>되돌리기<\/td>\n<td>&quot;마지막 커밋 상태로 되돌려 줘&quot;<\/td>\n<\/tr>\n<tr>\n<td>따로 작업<\/td>\n<td>&quot;dark-mode라는 브랜치를 만들고 거기서 작업해 줘&quot;<\/td>\n<\/tr>\n<tr>\n<td>GitHub에 올리기<\/td>\n<td>&quot;GitHub에 푸시해 줘&quot;<\/td>\n<\/tr>\n<tr>\n<td>합치기 요청<\/td>\n<td>&quot;이 브랜치로 PR 만들어 줘&quot;<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>💻 따라 하기<\/h3>\n<pre><code class=\"language-text\">이 폴더를 Git 저장소로 만들고, .gitignore에 .env를 넣은 다음, 첫 커밋을 해 줘. 커밋 메시지는 한국어로.\n<\/code><\/pre>\n<h3>좋은 습관<\/h3>\n<ul>\n<li><strong>기능 하나가 완성될 때마다 커밋<\/strong>: 작은 세이브 포인트가 많을수록 안전합니다.<\/li>\n<li><strong>큰 작업 전에 커밋<\/strong>: &quot;작업 시작 전에 지금 상태를 커밋해 줘&quot;<\/li>\n<li><strong>원본(main)에서 바로 작업하지 않기<\/strong>: 새 기능은 브랜치에서<\/li>\n<\/ul>\n<blockquote>\n<p>⚠️ &quot;강제로 푸시해 줘(force push)&quot;, &quot;기록을 지워 줘&quot; 같은 요청은 되돌릴 수 없는 손실을 만들 수 있습니다. 왜 필요한지 먼저 물어보세요.<\/p>\n<\/blockquote>\n<hr>\n<h2>7-5. GitHub에 처음 올리기<\/h2>\n<p><strong>① GitHub에서 빈 저장소 만들기<\/strong><\/p>\n<ol>\n<li><a href=\"https://github.com/new\">https://github.com/new<\/a> 접속<\/li>\n<li>Repository name 입력 (예: <code>my-first-project<\/code>)<\/li>\n<li>Public(공개) 또는 Private(비공개) 선택 → <strong>Create repository<\/strong><\/li>\n<\/ol>\n<p><strong>② 내 PC의 저장소와 연결하고 올리기<\/strong><\/p>\n<pre><code class=\"language-text\">https://github.com/내아이디/my-first-project 저장소에 연결하고 푸시해 줘.\n<\/code><\/pre>\n<p>처음 푸시할 때 GitHub 로그인 창이 뜨면 로그인합니다.<\/p>\n<blockquote>\n<p>💡 <strong>GitHub CLI(<code>gh<\/code>)<\/strong>를 설치해 두면 Claude가 PR 만들기 같은 GitHub 작업을 더 쉽게 합니다. <a href=\"https://cli.github.com\">https://cli.github.com<\/a> 에서 설치한 뒤 <code>gh auth login<\/code>으로 로그인하세요.<\/p>\n<\/blockquote>\n<hr>\n<h2>7-6. PR(Pull Request) 흐름<\/h2>\n<pre><code>main (원본)  ──●────────────────●── (합쳐짐)\n                \\              /\ndark-mode        ●──●──●──→ PR\n                (작업·커밋)\n<\/code><\/pre>\n<ol>\n<li>&quot;dark-mode 브랜치를 만들어서 다크 모드 기능을 만들어 줘&quot;<\/li>\n<li>&quot;커밋하고 푸시해 줘&quot;<\/li>\n<li>&quot;PR 만들어 줘. 무엇을 바꿨는지 설명도 써 줘&quot;<\/li>\n<li>GitHub에서 PR을 열어 변경 내용을 확인하고 <strong>Merge<\/strong> 버튼으로 합칩니다.<\/li>\n<\/ol>\n<blockquote>\n<p>💡 PR 전에 <code>/code-review<\/code>로 버그를 점검하면 더 안전합니다.<\/p>\n<\/blockquote>\n<hr>\n<h2>7-7. 웹(클라우드)에서 Claude Code 쓰기<\/h2>\n<p><strong>claude.ai/code<\/strong> 에서는 내 PC에 설치하지 않고도 Claude Code를 쓸 수 있습니다. 폰에서도 됩니다.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>내 PC (터미널)<\/th>\n<th>웹 (클라우드)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>작업 장소<\/td>\n<td>내 컴퓨터 폴더<\/td>\n<td>클라우드 컴퓨터에 복사된 GitHub 저장소<\/td>\n<\/tr>\n<tr>\n<td>결과 저장<\/td>\n<td>내 컴퓨터에 바로<\/td>\n<td><strong>GitHub에 푸시해야 남음<\/strong><\/td>\n<\/tr>\n<tr>\n<td>필요한 것<\/td>\n<td>설치<\/td>\n<td>GitHub 연결<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>연결하기<\/h3>\n<ol>\n<li><strong>GitHub 연결<\/strong>: claude.ai/code 에서 안내에 따라 GitHub 계정을 연결합니다. 터미널에서 <code>gh<\/code>를 쓰고 있다면 <code>/web-setup<\/code>으로도 연결할 수 있습니다.<\/li>\n<li><strong>Claude GitHub App 설치<\/strong>: <a href=\"https://github.com/apps/claude\">https://github.com/apps/claude<\/a> 에서 설치하고, Claude가 접근할 저장소를 고릅니다. 내 PC 터미널에서 <code>/install-github-app<\/code>을 실행해도 안내를 받을 수 있습니다.<\/li>\n<li>새 세션을 시작할 때 작업할 저장소를 고릅니다.<\/li>\n<\/ol>\n<h3>실제 사례: 푸시가 403 오류로 실패할 때<\/h3>\n<pre><code>fatal: unable to access &#39;https://github.com/...&#39;: The requested URL returned error: 403\n<\/code><\/pre>\n<p><strong>원인<\/strong>: Claude에게 그 저장소에 쓸 권한이 없습니다.<\/p>\n<p><strong>해결<\/strong>:<\/p>\n<ol>\n<li><a href=\"https://github.com/apps/claude/installations/select_target\">https://github.com/apps/claude/installations/select_target<\/a> 에서 내 계정 선택<\/li>\n<li><strong>Repository access<\/strong>에서 해당 저장소를 포함하거나 <strong>All repositories<\/strong> 선택 → <strong>Save<\/strong><\/li>\n<li><a href=\"https://claude.ai/connect-github\">https://claude.ai/connect-github<\/a> 에서 GitHub 다시 연결<\/li>\n<li>Claude에게 &quot;다시 푸시해 줘&quot;<\/li>\n<\/ol>\n<hr>\n<h2>✅ 확인하기<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> <code>git --version<\/code>으로 Git 설치를 확인했다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>user.name<\/code>과 <code>user.email<\/code>을 설정했다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> Claude에게 시켜서 첫 커밋을 했다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> GitHub에 저장소를 만들고 푸시했다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 브랜치를 만들어 작업하고 PR을 만들어 봤다<\/li>\n<\/ul>\n<h2>⚠️ 자주 하는 실수<\/h2>\n<ul>\n<li><strong>커밋 없이 오래 작업하기<\/strong>: 중간에 망가지면 돌아갈 곳이 없습니다.<\/li>\n<li><strong><code>.env<\/code>를 커밋하기<\/strong>: 한 번 GitHub에 올라간 비밀 정보는 지워도 기록에 남습니다. 키를 새로 발급받아야 합니다.<\/li>\n<li><strong>웹 세션에서 푸시를 잊기<\/strong>: 클라우드 세션은 끝나면 사라집니다. 꼭 푸시하세요.<\/li>\n<\/ul>\n<h2>🧠 퀴즈<\/h2>\n<ol>\n<li>Git 커밋을 가장 잘 설명한 것은?<ul>\n<li>(가) 파일 삭제  (나) 세이브 포인트  (다) 인터넷 업로드<\/li>\n<\/ul>\n<\/li>\n<li>내 커밋을 GitHub에 올리는 것은?<ul>\n<li>(가) 푸시  (나) 브랜치  (다) PR<\/li>\n<\/ul>\n<\/li>\n<li>웹(클라우드) 세션에서 작업 결과를 남기려면?<ul>\n<li>(가) 아무것도 안 해도 된다  (나) GitHub에 푸시해야 한다<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<details>\n<summary>정답 보기<\/summary>\n\n<ol>\n<li>(나)<\/li>\n<li>(가) — PR은 합쳐 달라는 요청입니다.<\/li>\n<li>(나) — 클라우드 컴퓨터는 세션이 끝나면 사라집니다.<\/li>\n<\/ol>\n<\/details>\n\n<h2>➡️ 다음 단계<\/h2>\n<p><a href=\"#/lesson/08-mini-projects\">8. 따라 하는 미니 프로젝트<\/a>에서 지금까지 배운 것으로 실제 앱 3개를 만들어 봅니다.<\/p>\n"},{"id":"08-mini-projects","title":"8. 따라 하는 미니 프로젝트","order":8,"duration":"3시간 30분","lastVerified":"2026-10-12","summary":"지금까지 배운 기능을 모아 실제로 동작하는 앱 3개 만들기 · 계획 → 작은 단계 → 확인 → 커밋의 흐름 익히기","html":"<h1>8. 따라 하는 미니 프로젝트<\/h1>\n<h2>📌 이 페이지에서 배울 것<\/h2>\n<ul>\n<li>지금까지 배운 기능을 모아 실제로 동작하는 앱 3개 만들기<\/li>\n<li>계획 → 작은 단계 → 확인 → 커밋의 흐름 익히기<\/li>\n<\/ul>\n<p>⏱ 예상 시간: 프로젝트 1 (30분) · 프로젝트 2 (1시간) · 프로젝트 3 (2시간)<\/p>\n<blockquote>\n<p>🛠 준비: 프로젝트마다 <strong>새 폴더<\/strong>를 만들고 그 안에서 <code>claude<\/code>를 실행하세요.<\/p>\n<pre><code class=\"language-bash\">mkdir profile-page\ncd profile-page\nclaude\n<\/code><\/pre>\n<\/blockquote>\n<h3>모든 프로젝트에 공통인 흐름<\/h3>\n<pre><code>① /init 또는 CLAUDE.md 작성 → ② /plan으로 계획 → ③ 한 단계씩 요청\n→ ④ 브라우저로 확인 → ⑤ 커밋 → ③으로 돌아가기\n<\/code><\/pre>\n<hr>\n<h2>⭐ 프로젝트 1. 자기소개 웹페이지 (30분)<\/h2>\n<h3>🎯 목표<\/h3>\n<p>내 이름, 소개, 좋아하는 것 3가지, 연락처 버튼이 있는 한 장짜리 웹페이지<\/p>\n<h3>💬 단계별 요청<\/h3>\n<p><strong>1단계: 규칙 정하기<\/strong><\/p>\n<pre><code class=\"language-text\">CLAUDE.md를 만들어 줘. 내용: HTML 파일 하나로 된 자기소개 페이지. 외부 라이브러리는 쓰지 않는다. 설명은 한국어로 쉽게.\n<\/code><\/pre>\n<p><strong>2단계: 기본 페이지<\/strong><\/p>\n<pre><code class=\"language-text\">index.html을 만들어 줘. 맨 위에 내 이름 &quot;홍길동&quot;과 한 줄 소개 &quot;AI로 코딩을 배우는 중입니다&quot;를 크게 보여 줘.\n<\/code><\/pre>\n<p><strong>3단계: 내용 추가<\/strong><\/p>\n<pre><code class=\"language-text\">소개 아래에 &quot;좋아하는 것&quot; 제목과 함께 등산, 커피, 고양이를 카드 3개로 나란히 보여 줘.\n<\/code><\/pre>\n<p><strong>4단계: 꾸미기<\/strong><\/p>\n<pre><code class=\"language-text\">전체 배경은 연한 베이지색, 카드는 흰색에 둥근 모서리와 옅은 그림자를 넣어 줘. 폰 화면에서는 카드가 세로로 쌓이게 해 줘.\n<\/code><\/pre>\n<p><strong>5단계: 버튼<\/strong><\/p>\n<pre><code class=\"language-text\">맨 아래에 &quot;이메일 보내기&quot; 버튼을 넣고, 누르면 hong@example.com으로 메일 쓰기 창이 열리게 해 줘.\n<\/code><\/pre>\n<p><strong>6단계: 저장<\/strong><\/p>\n<pre><code class=\"language-text\">Git 저장소로 만들고 커밋해 줘.\n<\/code><\/pre>\n<h3>✅ 확인 체크리스트<\/h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 브라우저에서 이름, 소개, 카드 3개, 버튼이 모두 보인다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 브라우저 창을 좁히면 카드가 세로로 쌓인다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 버튼을 누르면 메일 프로그램이 열린다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 커밋이 1개 이상 있다<\/li>\n<\/ul>\n<h3>🚀 도전 과제<\/h3>\n<ul>\n<li>&quot;다크 모드 전환 버튼을 추가해 줘&quot;<\/li>\n<li>&quot;내 사진을 넣고 싶어. <code>me.jpg<\/code>를 동그랗게 보여 줘&quot; (사진 파일을 폴더에 넣은 뒤)<\/li>\n<\/ul>\n<hr>\n<h2>⭐⭐ 프로젝트 2. 할 일 목록 앱 (1시간)<\/h2>\n<h3>🎯 목표<\/h3>\n<p>할 일을 추가하고, 완료 표시하고, 삭제할 수 있으며, <strong>브라우저를 닫았다 열어도 목록이 남는<\/strong> 앱<\/p>\n<h3>💬 단계별 요청<\/h3>\n<p><strong>1단계: 계획부터<\/strong><\/p>\n<pre><code class=\"language-text\">/plan 할 일 목록 웹앱을 만들고 싶어. HTML, CSS, JavaScript 파일 3개로 나누고, 라이브러리는 쓰지 마. 기능은 추가, 완료 체크, 삭제, 그리고 새로고침해도 목록이 유지되는 것. 먼저 계획만 보여 줘.\n<\/code><\/pre>\n<p>계획을 읽고 <strong>Yes, manually approve edits<\/strong>를 골라 진행합니다.<\/p>\n<p><strong>2단계: 추가 기능만 먼저<\/strong><\/p>\n<pre><code class=\"language-text\">계획의 첫 단계만 해 줘: 입력창과 &quot;추가&quot; 버튼, 그리고 추가한 할 일이 아래 목록에 나타나는 것까지.\n<\/code><\/pre>\n<p>➡️ 브라우저에서 직접 할 일을 3개 추가해 보고 확인한 뒤 커밋합니다.<\/p>\n<p><strong>3단계: 완료와 삭제<\/strong><\/p>\n<pre><code class=\"language-text\">각 할 일 앞에 체크박스를 넣어서, 체크하면 글자에 줄이 그어지게 해 줘. 오른쪽에는 삭제 버튼을 넣어 줘.\n<\/code><\/pre>\n<p><strong>4단계: 저장 기능<\/strong><\/p>\n<pre><code class=\"language-text\">새로고침해도 목록이 사라지지 않게 브라우저의 localStorage에 저장해 줘. 어떻게 동작하는지 쉽게 설명도 해 줘.\n<\/code><\/pre>\n<p><strong>5단계: 편의 기능<\/strong><\/p>\n<pre><code class=\"language-text\">입력창에서 Enter를 눌러도 추가되게 하고, 빈칸은 추가되지 않게 막아 줘. 맨 위에 &quot;남은 할 일: 3개&quot;처럼 개수도 보여 줘.\n<\/code><\/pre>\n<p><strong>6단계: 점검<\/strong><\/p>\n<pre><code class=\"language-text\">/code-review\n<\/code><\/pre>\n<p>찾은 문제가 있으면 &quot;찾은 문제를 고쳐 줘&quot;라고 요청한 뒤 커밋합니다.<\/p>\n<h3>✅ 확인 체크리스트<\/h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 할 일을 추가, 체크, 삭제할 수 있다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 새로고침해도 목록이 남아 있다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 빈칸은 추가되지 않는다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 남은 개수가 정확하다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 단계마다 커밋이 있다 (커밋 4개 이상)<\/li>\n<\/ul>\n<h3>🚀 도전 과제<\/h3>\n<ul>\n<li>&quot;할 일을 더블클릭하면 내용을 고칠 수 있게 해 줘&quot;<\/li>\n<li>&quot;전체 / 진행 중 / 완료 필터 버튼을 추가해 줘&quot;<\/li>\n<\/ul>\n<hr>\n<h2>⭐⭐⭐ 프로젝트 3. 날씨 앱 + GitHub에 공개 (2시간)<\/h2>\n<h3>🎯 목표<\/h3>\n<p>도시 이름을 입력하면 현재 날씨와 3일 예보를 보여 주는 앱을 만들고, <strong>GitHub Pages로 인터넷에 공개<\/strong>하기<\/p>\n<blockquote>\n<p>💡 날씨 정보는 <strong>Open-Meteo<\/strong>(<a href=\"https://open-meteo.com)%EB%A5%BC\">https://open-meteo.com)를<\/a> 씁니다. 가입이나 API 키가 필요 없는 무료 날씨 서비스입니다.<\/p>\n<\/blockquote>\n<h3>💬 단계별 요청<\/h3>\n<p><strong>1단계: 계획<\/strong><\/p>\n<pre><code class=\"language-text\">/plan 도시 이름을 입력하면 현재 기온, 날씨 상태, 3일 예보를 보여 주는 웹앱을 만들고 싶어. Open-Meteo의 지오코딩 API로 도시를 좌표로 바꾸고, 예보 API로 날씨를 가져와. HTML/CSS/JS만 쓰고 라이브러리는 쓰지 마.\n<\/code><\/pre>\n<p><strong>2단계: 도시 검색<\/strong><\/p>\n<pre><code class=\"language-text\">첫 단계만 해 줘: 도시 이름을 입력하면 그 도시의 위도와 경도를 화면에 보여 주는 것까지. 한국 도시 이름(예: 부산)도 되게 해 줘.\n<\/code><\/pre>\n<p><strong>3단계: 현재 날씨<\/strong><\/p>\n<pre><code class=\"language-text\">찾은 좌표로 현재 기온과 날씨 상태를 가져와서 보여 줘. 날씨 코드는 &quot;맑음&quot;, &quot;흐림&quot;, &quot;비&quot;처럼 한국어와 이모지로 바꿔 줘.\n<\/code><\/pre>\n<p><strong>4단계: 3일 예보<\/strong><\/p>\n<pre><code class=\"language-text\">아래에 3일 예보를 카드로 보여 줘. 날짜, 최고/최저 기온, 날씨 이모지를 넣어 줘.\n<\/code><\/pre>\n<p><strong>5단계: 오류 처리<\/strong><\/p>\n<pre><code class=\"language-text\">없는 도시를 입력하거나 인터넷이 끊겼을 때 친절한 안내 문구를 보여 줘. 불러오는 동안에는 &quot;불러오는 중…&quot;을 보여 줘.\n<\/code><\/pre>\n<p><strong>6단계: GitHub에 올리기<\/strong><\/p>\n<pre><code class=\"language-text\">Git 저장소로 만들어 커밋하고, GitHub에 weather-app 저장소를 만들어서 푸시해 줘.\n<\/code><\/pre>\n<p>(GitHub 저장소를 Claude가 만들 수 없으면 7-5처럼 직접 만든 뒤 &quot;이 주소로 푸시해 줘&quot;라고 요청합니다.)<\/p>\n<p><strong>7단계: 인터넷에 공개 (GitHub Pages)<\/strong><\/p>\n<ol>\n<li>GitHub의 저장소 페이지 → <strong>Settings<\/strong> → <strong>Pages<\/strong><\/li>\n<li><strong>Source<\/strong>: Deploy from a branch, <strong>Branch<\/strong>: <code>main<\/code> / <code>(root)<\/code> → <strong>Save<\/strong><\/li>\n<li>1~2분 뒤 <code>https://내아이디.github.io/weather-app/<\/code> 에서 내 앱을 볼 수 있습니다.<\/li>\n<\/ol>\n<h3>✅ 확인 체크리스트<\/h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> &quot;서울&quot;, &quot;부산&quot;, &quot;Tokyo&quot;를 검색하면 날씨가 나온다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 3일 예보 카드가 보인다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 없는 도시를 입력하면 안내 문구가 나온다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> GitHub Pages 주소로 폰에서도 열린다<\/li>\n<\/ul>\n<h3>🚀 도전 과제<\/h3>\n<ul>\n<li>&quot;마지막으로 검색한 도시를 기억해서 다음에 열면 바로 보여 줘&quot;<\/li>\n<li>&quot;현재 위치 버튼을 눌러서 내 위치의 날씨를 보여 줘&quot;<\/li>\n<\/ul>\n<hr>\n<h2>🎓 다 만들었다면<\/h2>\n<p>축하합니다! 이제 Claude Code로 <strong>계획하고, 나눠서 시키고, 확인하고, 저장하는<\/strong> 흐름을 모두 경험했습니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>배운 것<\/th>\n<th>어디서 썼나<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>CLAUDE.md<\/td>\n<td>모든 프로젝트 1단계<\/td>\n<\/tr>\n<tr>\n<td><code>/plan<\/code><\/td>\n<td>프로젝트 2, 3<\/td>\n<\/tr>\n<tr>\n<td><code>@파일<\/code>, 구체적인 요청<\/td>\n<td>모든 단계<\/td>\n<\/tr>\n<tr>\n<td><code>/code-review<\/code><\/td>\n<td>프로젝트 2<\/td>\n<\/tr>\n<tr>\n<td>Git 커밋, 푸시<\/td>\n<td>모든 프로젝트<\/td>\n<\/tr>\n<tr>\n<td>오류 처리 요청<\/td>\n<td>프로젝트 3<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>⚠️ 자주 하는 실수<\/h2>\n<ul>\n<li><strong>확인 없이 다음 단계로 넘어가기<\/strong>: 단계마다 브라우저로 열어 보세요.<\/li>\n<li><strong>한 번에 프로젝트 전체를 요청하기<\/strong>: 결과가 엉키면 어디가 문제인지 찾기 어렵습니다.<\/li>\n<li><strong>같은 폴더에서 여러 프로젝트 하기<\/strong>: 프로젝트마다 새 폴더를 만드세요.<\/li>\n<\/ul>\n<h2>➡️ 다음 단계<\/h2>\n<p><a href=\"#/lesson/09-advanced\">9. 한 단계 더<\/a>에서 나만의 명령어 만들기, 외부 도구 연결 등 더 강력한 기능을 둘러봅니다.<\/p>\n"},{"id":"09-advanced","title":"9. 한 단계 더 (심화)","order":9,"duration":"40분","lastVerified":"2026-10-12","summary":"Claude Code를 내 방식대로 확장하는 기능 5가지 · 각 기능을 언제 쓰면 좋은지","html":"<h1>9. 한 단계 더 (심화)<\/h1>\n<h2>📌 이 페이지에서 배울 것<\/h2>\n<ul>\n<li>Claude Code를 내 방식대로 확장하는 기능 5가지<\/li>\n<li>각 기능을 <strong>언제<\/strong> 쓰면 좋은지<\/li>\n<\/ul>\n<p>⏱ 예상 시간: 40분<\/p>\n<blockquote>\n<p>💡 이 장은 <strong>지금 다 익히지 않아도 됩니다.<\/strong> 1~8장에 익숙해진 뒤 &quot;이런 게 있었지&quot; 하고 돌아오세요.<\/p>\n<\/blockquote>\n<hr>\n<h2>한눈에 보기<\/h2>\n<table>\n<thead>\n<tr>\n<th>기능<\/th>\n<th>한 줄 설명<\/th>\n<th>이럴 때<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Skills<\/strong><\/td>\n<td>나만의 <code>/명령어<\/code> 만들기<\/td>\n<td>같은 요청을 자주 반복할 때<\/td>\n<\/tr>\n<tr>\n<td><strong>서브에이전트<\/strong><\/td>\n<td>특정 역할을 맡
