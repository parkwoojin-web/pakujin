은 보조 Claude<\/td>\n<td>코드 검토 등 전문 작업을 따로 맡길 때<\/td>\n<\/tr>\n<tr>\n<td><strong>MCP<\/strong><\/td>\n<td>외부 서비스 연결<\/td>\n<td>Notion, 데이터베이스 등과 연동할 때<\/td>\n<\/tr>\n<tr>\n<td><strong>Hooks<\/strong><\/td>\n<td>정해진 순간에 자동 실행<\/td>\n<td>&quot;파일 고칠 때마다 항상 ○○&quot; 해야 할 때<\/td>\n<\/tr>\n<tr>\n<td><strong>플러그인<\/strong><\/td>\n<td>위 기능들을 묶은 꾸러미<\/td>\n<td>남이 만든 기능을 한 번에 설치할 때<\/td>\n<\/tr>\n<\/tbody><\/table>\n<hr>\n<h2>9-1. Skills: 나만의 <code>/명령어<\/code><\/h2>\n<p>자주 하는 요청을 <strong>명령어로 등록<\/strong>합니다.<\/p>\n<h3>만드는 법<\/h3>\n<p><code>.claude/skills/커밋정리/SKILL.md<\/code> 파일을 만들고:<\/p>\n<pre><code class=\"language-markdown\">---\ndescription: 변경 사항을 확인하고 한국어 커밋 메시지로 커밋한다\n---\n1. 바뀐 파일과 내용을 확인한다.\n2. `feat:`, `fix:`, `docs:` 중 알맞은 말머리로 한국어 커밋 메시지를 만든다.\n3. 커밋하고, 무엇을 커밋했는지 3줄로 알려 준다.\n<\/code><\/pre>\n<p>이제 <code>/커밋정리<\/code>라고 입력하면 이 순서대로 실행됩니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>위치<\/th>\n<th>쓸 수 있는 곳<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>.claude/skills/<\/code><\/td>\n<td>이 프로젝트에서만<\/td>\n<\/tr>\n<tr>\n<td><code>~/.claude/skills/<\/code><\/td>\n<td>내 모든 프로젝트에서<\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote>\n<p>💡 <code>description<\/code>이 내 요청과 맞으면 Claude가 <strong>알아서<\/strong> 이 Skill을 쓰기도 합니다. <code>/skills<\/code>로 목록을 볼 수 있습니다.<\/p>\n<\/blockquote>\n<blockquote>\n<p>💡 말로 만들어 달라고 해도 됩니다: &quot;커밋 메시지를 정리해서 커밋하는 Skill을 만들어 줘&quot;<\/p>\n<\/blockquote>\n<hr>\n<h2>9-2. 서브에이전트: 역할을 맡은 보조 Claude<\/h2>\n<p>특정 일만 전문으로 하는 <strong>보조 Claude<\/strong>를 만듭니다. 서브에이전트는 <strong>자기만의 대화 공간<\/strong>에서 일하고 결과만 돌려주므로, 메인 대화가 복잡해지지 않습니다.<\/p>\n<h3>만드는 법<\/h3>\n<p><code>.claude/agents/code-reviewer.md<\/code>:<\/p>\n<pre><code class=\"language-markdown\">---\nname: code-reviewer\ndescription: 코드를 검토해서 버그와 개선점을 찾는다\ntools: Read, Glob, Grep\n---\n\n너는 꼼꼼한 코드 검토자다. 코드를 읽고 버그, 보안 문제, 개선점을\n초보자도 이해할 수 있게 설명한다. 코드는 직접 고치지 않는다.\n<\/code><\/pre>\n<p><code>tools<\/code>에 읽기 도구만 넣었기 때문에, 이 서브에이전트는 파일을 <strong>읽기만<\/strong> 하고 고치지 못합니다.<\/p>\n<h3>쓰는 법<\/h3>\n<pre><code class=\"language-text\">code-reviewer 서브에이전트로 최근 변경 사항을 검토해 줘.\n<\/code><\/pre>\n<hr>\n<h2>9-3. MCP: 외부 서비스 연결<\/h2>\n<p><strong>MCP(Model Context Protocol)<\/strong>는 Claude Code에 외부 서비스를 연결하는 표준 방법입니다. 연결하면 Claude가 그 서비스를 직접 읽고 쓸 수 있습니다.<\/p>\n<h3>연결하는 법 (터미널에서)<\/h3>\n<pre><code class=\"language-bash\">claude mcp add --transport http notion https://mcp.notion.com/mcp\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>명령<\/th>\n<th>기능<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>claude mcp list<\/code><\/td>\n<td>연결된 서버와 상태 보기<\/td>\n<\/tr>\n<tr>\n<td><code>claude mcp remove 이름<\/code><\/td>\n<td>연결 해제<\/td>\n<\/tr>\n<tr>\n<td><code>/mcp<\/code> (Claude Code 안에서)<\/td>\n<td>상태 확인, 로그인, 관리<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>적용 범위<\/strong> (<code>--scope<\/code>)<\/p>\n<ul>\n<li><code>local<\/code> (기본): 이 프로젝트에서 나만<\/li>\n<li><code>project<\/code>: <code>.mcp.json<\/code>에 저장되어 팀과 공유<\/li>\n<li><code>user<\/code>: 내 모든 프로젝트<\/li>\n<\/ul>\n<blockquote>\n<p>⚠️ MCP 서버는 내 데이터에 접근할 수 있습니다. <strong>믿을 수 있는 곳에서 만든 서버만<\/strong> 연결하세요.<\/p>\n<\/blockquote>\n<hr>\n<h2>9-4. Hooks: 자동 실행 규칙<\/h2>\n<p>CLAUDE.md의 규칙은 Claude가 <strong>참고<\/strong>하는 것이라 가끔 놓칠 수 있습니다. <strong>Hooks<\/strong>는 정해진 순간에 <strong>항상<\/strong> 실행되는 명령입니다.<\/p>\n<h3>예시: 파일을 고칠 때마다 자동 정리<\/h3>\n<pre><code class=\"language-json\">{\n  &quot;hooks&quot;: {\n    &quot;PostToolUse&quot;: [\n      {\n        &quot;matcher&quot;: &quot;Edit|Write&quot;,\n        &quot;hooks&quot;: [\n          { &quot;type&quot;: &quot;command&quot;, &quot;command&quot;: &quot;jq -r &#39;.tool_input.file_path&#39; | xargs npx prettier --write&quot; }\n        ]\n      }\n    ]\n  }\n}\n<\/code><\/pre>\n<p>Claude가 파일을 고치거나 만든 뒤(<code>PostToolUse<\/code>)마다, 그 파일을 Prettier로 자동 정리합니다.<\/p>\n<h3>자주 쓰는 순간<\/h3>\n<table>\n<thead>\n<tr>\n<th>이름<\/th>\n<th>언제<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>PreToolUse<\/code><\/td>\n<td>Claude가 도구를 쓰기 <strong>전<\/strong> (위험한 작업 막기)<\/td>\n<\/tr>\n<tr>\n<td><code>PostToolUse<\/code><\/td>\n<td>도구를 쓴 <strong>후<\/strong> (자동 정리, 검사)<\/td>\n<\/tr>\n<tr>\n<td><code>Notification<\/code><\/td>\n<td>Claude가 내 입력을 기다릴 때 (알림 보내기)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote>\n<p>💡 JSON을 직접 쓰기 어려우면: <code>/update-config 파일을 고칠 때마다 prettier로 정리하는 hook을 만들어 줘<\/code>. 설정된 Hooks는 <code>/hooks<\/code>로 확인합니다.<\/p>\n<\/blockquote>\n<hr>\n<h2>9-5. 플러그인<\/h2>\n<p>Skills, 서브에이전트, Hooks, MCP 등을 <strong>하나로 묶은 꾸러미<\/strong>입니다. 남이 만든 플러그인을 설치하면 여러 기능이 한 번에 추가됩니다.<\/p>\n<pre><code class=\"language-text\">/plugin\n<\/code><\/pre>\n<p>메뉴에서 플러그인을 찾아 설치하고, 켜고 끌 수 있습니다.<\/p>\n<blockquote>\n<p>⚠️ 플러그인도 내 컴퓨터에서 명령을 실행할 수 있습니다. 출처를 확인하고 설치하세요.<\/p>\n<\/blockquote>\n<hr>\n<h2>9-6. 다른 곳에서 쓰기<\/h2>\n<table>\n<thead>\n<tr>\n<th>어디서<\/th>\n<th>방법<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>VS Code<\/strong><\/td>\n<td>확장(Extensions)에서 &quot;Claude Code&quot; 검색 후 설치. 편집기 안에서 바로 사용<\/td>\n<\/tr>\n<tr>\n<td><strong>데스크톱 앱<\/strong><\/td>\n<td>claude.com/download 에서 설치. 터미널 없이 사용<\/td>\n<\/tr>\n<tr>\n<td><strong>웹·모바일<\/strong><\/td>\n<td>claude.ai/code. GitHub 저장소로 작업 (7장)<\/td>\n<\/tr>\n<tr>\n<td><strong>터미널 → 앱으로 옮기기<\/strong><\/td>\n<td><code>/desktop<\/code> (지금 대화를 데스크톱 앱에서 이어 하기)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<hr>\n<h2>9-7. 코드 검토 도구<\/h2>\n<table>\n<thead>\n<tr>\n<th>명령<\/th>\n<th>기능<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>/code-review<\/code><\/td>\n<td>바뀐 코드에서 버그 찾기. <code>--fix<\/code>를 붙이면 바로 고침<\/td>\n<\/tr>\n<tr>\n<td><code>/security-review<\/code><\/td>\n<td>보안 문제 점검<\/td>\n<\/tr>\n<tr>\n<td><code>/simplify<\/code><\/td>\n<td>바뀐 코드를 더 깔끔하게 정리<\/td>\n<\/tr>\n<\/tbody><\/table>\n<blockquote>\n<p>💡 PR을 만들기 전에 <code>/code-review<\/code> → <code>/security-review<\/code> 순서로 점검하는 습관을 들이면 좋습니다.<\/p>\n<\/blockquote>\n<hr>\n<h2>✅ 확인하기<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> Skill을 하나 만들어 <code>/이름<\/code>으로 실행해 봤다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 읽기 전용 서브에이전트를 만들어 검토를 맡겨 봤다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>/mcp<\/code>로 MCP 상태 화면을 열어 봤다<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>/hooks<\/code>로 설정된 Hooks를 확인해 봤다<\/li>\n<\/ul>\n<h2>⚠️ 자주 하는 실수<\/h2>\n<ul>\n<li><strong>처음부터 모든 기능을 쓰려고 하기<\/strong>: 필요할 때 하나씩 추가하세요.<\/li>\n<li><strong>출처 모를 MCP·플러그인 설치<\/strong>: 내 파일과 계정에 접근할 수 있습니다.<\/li>\n<li><strong>꼭 지켜야 할 규칙을 CLAUDE.md에만 적기<\/strong>: 반드시 지켜야 하면 Hooks나 차단 규칙(6장)을 쓰세요.<\/li>\n<\/ul>\n<h2>🧠 퀴즈<\/h2>\n<ol>\n<li>같은 요청을 자주 반복한다면?<ul>\n<li>(가) MCP  (나) Skills  (다) Hooks<\/li>\n<\/ul>\n<\/li>\n<li>&quot;파일을 고칠 때마다 <strong>항상<\/strong>&quot; 무언가를 실행하려면?<ul>\n<li>(가) CLAUDE.md에 적는다  (나) Hooks를 쓴다<\/li>\n<\/ul>\n<\/li>\n<li>Notion 같은 외부 서비스와 연결하려면?<ul>\n<li>(가) MCP  (나) 서브에이전트<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<details>\n<summary>정답 보기<\/summary>\n\n<ol>\n<li>(나)<\/li>\n<li>(나) — CLAUDE.md는 참고, Hooks는 항상 실행됩니다.<\/li>\n<li>(가)<\/li>\n<\/ol>\n<\/details>\n\n<h2>➡️ 다음 단계<\/h2>\n<p><a href=\"#/lesson/10-appendix\">부록<\/a>에서 명령어·단축키 치트시트, 오류 해결법, 용어 사전을 확인하세요.<\/p>\n"},{"id":"10-appendix","title":"📎 부록","order":10,"duration":"필요할 때","lastVerified":"2026-10-12","summary":"","html":"<h1>📎 부록<\/h1>\n<h2>A. 명령어 치트시트<\/h2>\n<h3>⭐ 1단계: 처음 꼭 알아야 할 것<\/h3>\n<table>\n<thead>\n<tr>\n<th>명령어<\/th>\n<th>하는 일<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>/help<\/code><\/td>\n<td>도움말과 명령어 목록<\/td>\n<\/tr>\n<tr>\n<td><code>/powerup<\/code><\/td>\n<td>대화형 레슨으로 기능 둘러보기<\/td>\n<\/tr>\n<tr>\n<td><code>/init<\/code><\/td>\n<td>프로젝트를 분석해 CLAUDE.md 만들기<\/td>\n<\/tr>\n<tr>\n<td><code>/clear<\/code><\/td>\n<td>새 대화 시작<\/td>\n<\/tr>\n<tr>\n<td><code>/compact<\/code><\/td>\n<td>대화를 요약해서 공간 확보<\/td>\n<\/tr>\n<tr>\n<td><code>/rewind<\/code><\/td>\n<td>코드·대화를 이전 시점으로 되돌리기 (별칭 <code>/undo<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>/resume<\/code><\/td>\n<td>지난 대화 이어 하기<\/td>\n<\/tr>\n<tr>\n<td><code>/exit<\/code><\/td>\n<td>종료<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>2단계: 작업을 잘하게<\/h3>\n<table>\n<thead>\n<tr>\n<th>명령어<\/th>\n<th>하는 일<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>/plan [설명]<\/code><\/td>\n<td>계획 모드로 시작<\/td>\n<\/tr>\n<tr>\n<td><code>/diff<\/code><\/td>\n<td>바뀐 내용 보기<\/td>\n<\/tr>\n<tr>\n<td><code>/memory<\/code><\/td>\n<td>CLAUDE.md 편집, 자동 메모리 관리<\/td>\n<\/tr>\n<tr>\n<td><code>/context<\/code><\/td>\n<td>대화 공간 사용량 보기<\/td>\n<\/tr>\n<tr>\n<td><code>/model<\/code><\/td>\n<td>모델 바꾸기<\/td>\n<\/tr>\n<tr>\n<td><code>/effort<\/code><\/td>\n<td>생각 깊이 바꾸기<\/td>\n<\/tr>\n<tr>\n<td><code>/copy<\/code><\/td>\n<td>마지막 답변 복사<\/td>\n<\/tr>\n<tr>\n<td><code>/btw [질문]<\/code><\/td>\n<td>대화에 섞지 않는 곁가지 질문<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>3단계: 검토와 Git<\/h3>\n<table>\n<thead>\n<tr>\n<th>명령어<\/th>\n<th>하는 일<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>/code-review<\/code><\/td>\n<td>버그 찾기 (<code>--fix<\/code>로 바로 고침)<\/td>\n<\/tr>\n<tr>\n<td><code>/security-review<\/code><\/td>\n<td>보안 점검<\/td>\n<\/tr>\n<tr>\n<td><code>/simplify<\/code><\/td>\n<td>코드 정리<\/td>\n<\/tr>\n<tr>\n<td><code>/install-github-app<\/code><\/td>\n<td>Claude GitHub App 설치 안내<\/td>\n<\/tr>\n<tr>\n<td><code>/web-setup<\/code><\/td>\n<td>웹 세션용 GitHub 연결<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>4단계: 설정과 상태<\/h3>\n<table>\n<thead>\n<tr>\n<th>명령어<\/th>\n<th>하는 일<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>/config<\/code><\/td>\n<td>설정 화면<\/td>\n<\/tr>\n<tr>\n<td><code>/status<\/code><\/td>\n<td>버전·모델·계정 상태<\/td>\n<\/tr>\n<tr>\n<td><code>/usage<\/code><\/td>\n<td>사용량과 한도 (별칭 <code>/cost<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>/permissions<\/code><\/td>\n<td>허용·확인·차단 규칙<\/td>\n<\/tr>\n<tr>\n<td><code>/doctor<\/code><\/td>\n<td>설치·설정 문제 진단<\/td>\n<\/tr>\n<tr>\n<td><code>/theme<\/code><\/td>\n<td>색상 테마<\/td>\n<\/tr>\n<tr>\n<td><code>/terminal-setup<\/code><\/td>\n<td>Shift+Enter 줄바꿈 설정<\/td>\n<\/tr>\n<tr>\n<td><code>/login<\/code>, <code>/logout<\/code><\/td>\n<td>로그인, 로그아웃<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>5단계: 심화<\/h3>\n<table>\n<thead>\n<tr>\n<th>명령어<\/th>\n<th>하는 일<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>/skills<\/code><\/td>\n<td>Skill 목록<\/td>\n<\/tr>\n<tr>\n<td><code>/agents<\/code><\/td>\n<td>서브에이전트 만들기 안내<\/td>\n<\/tr>\n<tr>\n<td><code>/mcp<\/code><\/td>\n<td>MCP 연결 관리<\/td>\n<\/tr>\n<tr>\n<td><code>/hooks<\/code><\/td>\n<td>Hooks 확인<\/td>\n<\/tr>\n<tr>\n<td><code>/plugin<\/code><\/td>\n<td>플러그인 관리<\/td>\n<\/tr>\n<tr>\n<td><code>/update-config<\/code><\/td>\n<td>말로 설정 바꾸기<\/td>\n<\/tr>\n<tr>\n<td><code>/export<\/code><\/td>\n<td>대화를 파일로 저장<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>터미널에서 쓰는 명령<\/h3>\n<table>\n<thead>\n<tr>\n<th>명령<\/th>\n<th>하는 일<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>claude<\/code><\/td>\n<td>시작<\/td>\n<\/tr>\n<tr>\n<td><code>claude --version<\/code><\/td>\n<td>버전 확인<\/td>\n<\/tr>\n<tr>\n<td><code>claude doctor<\/code><\/td>\n<td>설치 점검<\/td>\n<\/tr>\n<tr>\n<td><code>claude update<\/code><\/td>\n<td>지금 바로 업데이트<\/td>\n<\/tr>\n<tr>\n<td><code>claude --permission-mode plan<\/code><\/td>\n<td>계획 모드로 시작<\/td>\n<\/tr>\n<tr>\n<td><code>claude mcp list<\/code><\/td>\n<td>MCP 서버 목록<\/td>\n<\/tr>\n<\/tbody><\/table>\n<hr>\n<h2>B. 단축키 모음<\/h2>\n<table>\n<thead>\n<tr>\n<th>단축키<\/th>\n<th>기능<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>Esc<\/code><\/td>\n<td>Claude 멈추기 / 창 닫기<\/td>\n<\/tr>\n<tr>\n<td><code>Esc<\/code> <code>Esc<\/code> (빈 입력창)<\/td>\n<td>되돌리기 메뉴<\/td>\n<\/tr>\n<tr>\n<td><code>Shift + Tab<\/code><\/td>\n<td>권한 모드 바꾸기<\/td>\n<\/tr>\n<tr>\n<td><code>Ctrl + C<\/code><\/td>\n<td>중단 / 입력 지우기 / 두 번 누르면 종료<\/td>\n<\/tr>\n<tr>\n<td><code>↑<\/code> <code>↓<\/code><\/td>\n<td>이전 입력 불러오기<\/td>\n<\/tr>\n<tr>\n<td><code>Ctrl + R<\/code><\/td>\n<td>이전 입력 검색<\/td>\n<\/tr>\n<tr>\n<td><code>\\<\/code> + <code>Enter<\/code> 또는 <code>Ctrl + J<\/code><\/td>\n<td>줄바꿈 (모든 터미널)<\/td>\n<\/tr>\n<tr>\n<td><code>Shift + Enter<\/code><\/td>\n<td>줄바꿈 (지원하는 터미널)<\/td>\n<\/tr>\n<tr>\n<td><code>Ctrl + V<\/code> (Windows는 <code>Alt + V<\/code>)<\/td>\n<td>이미지 붙여 넣기<\/td>\n<\/tr>\n<tr>\n<td><code>Ctrl + O<\/code><\/td>\n<td>작업 상세 기록 보기<\/td>\n<\/tr>\n<tr>\n<td><code>Ctrl + T<\/code><\/td>\n<td>Claude의 할 일 목록 보기<\/td>\n<\/tr>\n<tr>\n<td><code>Ctrl + G<\/code><\/td>\n<td>입력(또는 계획)을 편집기로 열기<\/td>\n<\/tr>\n<tr>\n<td><code>?<\/code> (빈 입력창)<\/td>\n<td>단축키 도움말<\/td>\n<\/tr>\n<tr>\n<td><code>@<\/code><\/td>\n<td>파일 지정<\/td>\n<\/tr>\n<tr>\n<td><code>!<\/code> (맨 앞)<\/td>\n<td>터미널 명령 바로 실행<\/td>\n<\/tr>\n<tr>\n<td><code>/<\/code> (맨 앞)<\/td>\n<td>명령어<\/td>\n<\/tr>\n<\/tbody><\/table>\n<hr>\n<h2>C. 자주 나는 오류와 해결법<\/h2>\n<table>\n<thead>\n<tr>\n<th>증상<\/th>\n<th>원인<\/th>\n<th>해결<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>claude<\/code>를 찾을 수 없음<\/td>\n<td>설치 후 터미널을 새로 열지 않음<\/td>\n<td>터미널 새로 열기 → 그래도 안 되면 재시작<\/td>\n<\/tr>\n<tr>\n<td><code>&#39;&amp;&amp;&#39; is not a valid statement separator<\/code><\/td>\n<td>PowerShell에서 CMD용 명령<\/td>\n<td><code>irm https://claude.ai/install.ps1 | iex<\/code> 사용<\/td>\n<\/tr>\n<tr>\n<td><code>&#39;irm&#39; is not recognized<\/code><\/td>\n<td>CMD에서 PowerShell용 명령<\/td>\n<td>CMD용 설치 명령 사용<\/td>\n<\/tr>\n<tr>\n<td>로그인 후 사용 불가<\/td>\n<td>무료 요금제<\/td>\n<td>Pro 이상 요금제<\/td>\n<\/tr>\n<tr>\n<td>사용량 한도에 걸림<\/td>\n<td>요금제 한도 초과<\/td>\n<td><code>/usage<\/code>로 확인, 잠시 기다리거나 <code>/rate-limit-options<\/code><\/td>\n<\/tr>\n<tr>\n<td>엉뚱한 폴더에 파일이 생김<\/td>\n<td>다른 폴더에서 <code>claude<\/code> 실행<\/td>\n<td><code>/exit<\/code> → <code>cd 프로젝트폴더<\/code> → <code>claude<\/code><\/td>\n<\/tr>\n<tr>\n<td>Claude가 규칙을 안 지킴<\/td>\n<td>규칙이 애매하거나 너무 김<\/td>\n<td>구체적으로, 200줄 이하로. <code>/context<\/code>로 읽혔는지 확인<\/td>\n<\/tr>\n<tr>\n<td>대화가 느리고 앞 내용을 잊음<\/td>\n<td>대화 공간이 가득 참<\/td>\n<td><code>/compact<\/code> 또는 <code>/clear<\/code><\/td>\n<\/tr>\n<tr>\n<td>자동 모드에서 작업이 막힘<\/td>\n<td>안전 검사기가 위험하다고 판단<\/td>\n<td><code>/permissions<\/code>의 최근 거부 목록 확인, 필요하면 수동 모드로<\/td>\n<\/tr>\n<tr>\n<td><code>git push<\/code>가 403 오류<\/td>\n<td>Claude에게 저장소 권한 없음<\/td>\n<td>Claude GitHub App에서 저장소 허용 + claude.ai/connect-github 재연결<\/td>\n<\/tr>\n<tr>\n<td><code>/rewind<\/code> 후에도 파일이 그대로<\/td>\n<td>터미널 명령으로 바뀐 파일<\/td>\n<td>Git으로 되돌리기 (&quot;마지막 커밋 상태로 되돌려 줘&quot;)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>그래도 안 되면: <code>claude doctor<\/code> 실행 → 공식 문서 <a href=\"https://code.claude.com/docs/en/troubleshoot-install\">https://code.claude.com/docs/en/troubleshoot-install<\/a><\/p>\n<hr>\n<h2>D. 용어 사전<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>터미널<\/strong><\/td>\n<td>글자로 컴퓨터에 명령하는 창<\/td>\n<\/tr>\n<tr>\n<td><strong>프롬프트<\/strong><\/td>\n<td>① 터미널에서 명령을 기다리는 표시 ② Claude에게 보내는 요청 문장<\/td>\n<\/tr>\n<tr>\n<td><strong>CLI<\/strong><\/td>\n<td>터미널에서 쓰는 프로그램 (Command Line Interface)<\/td>\n<\/tr>\n<tr>\n<td><strong>컨텍스트<\/strong><\/td>\n<td>Claude가 지금 기억하고 있는 대화와 파일 내용. 크기에 한계가 있음<\/td>\n<\/tr>\n<tr>\n<td><strong>토큰<\/strong><\/td>\n<td>Claude가 글을 처리하는 단위. 사용량과 비용의 기준<\/td>\n<\/tr>\n<tr>\n<td><strong>모델<\/strong><\/td>\n<td>Claude의 &quot;두뇌&quot; 종류. 강한 모델일수록 어려운 일을 잘하지만 사용량이 큼<\/td>\n<\/tr>\n<tr>\n<td><strong>권한 모드<\/strong><\/td>\n<td>Claude가 묻지 않고 할 수 있는 일의 범위<\/td>\n<\/tr>\n<tr>\n<td><strong>CLAUDE.md<\/strong><\/td>\n<td>Claude가 매번 읽는 프로젝트 안내문<\/td>\n<\/tr>\n<tr>\n<td><strong>저장소 (Repository)<\/strong><\/td>\n<td>Git이 관리하는 프로젝트 폴더<\/td>\n<\/tr>\n<tr>\n<td><strong>커밋<\/strong><\/td>\n<td>지금 상태를 저장한 세이브 포인트<\/td>\n<\/tr>\n<tr>\n<td><strong>브랜치<\/strong><\/td>\n<td>원본을 건드리지 않고 따로 작업하는 갈래<\/td>\n<\/tr>\n<tr>\n<td><strong>푸시<\/strong><\/td>\n<td>커밋을 GitHub에 올리기<\/td>\n<\/tr>\n<tr>\n<td><strong>PR (Pull Request)<\/strong><\/td>\n<td>브랜치 작업을 원본에 합쳐 달라는 요청<\/td>\n<\/tr>\n<tr>\n<td><strong>API<\/strong><\/td>\n<td>프로그램끼리 정보를 주고받는 창구<\/td>\n<\/tr>\n<tr>\n<td><strong>API 키<\/strong><\/td>\n<td>API를 쓰기 위한 비밀 열쇠. 절대 공개하면 안 됨<\/td>\n<\/tr>\n<tr>\n<td><strong><code>.env<\/code><\/strong><\/td>\n<td>비밀 정보를 따로 보관하는 파일<\/td>\n<\/tr>\n<tr>\n<td><strong><code>.gitignore<\/code><\/strong><\/td>\n<td>Git에 올리지 않을 파일 목록<\/td>\n<\/tr>\n<tr>\n<td><strong>MCP<\/strong><\/td>\n<td>Claude Code에 외부 서비스를 연결하는 표준 방법<\/td>\n<\/tr>\n<tr>\n<td><strong>Skill<\/strong><\/td>\n<td>나만의 <code>/명령어<\/code>로 등록한 작업 순서<\/td>\n<\/tr>\n<tr>\n<td><strong>서브에이전트<\/strong><\/td>\n<td>특정 역할을 맡은 보조 Claude<\/td>\n<\/tr>\n<tr>\n<td><strong>Hook<\/strong><\/td>\n<td>정해진 순간에 항상 자동 실행되는 명령<\/td>\n<\/tr>\n<\/tbody><\/table>\n<hr>\n<h2>E. CLAUDE.md 템플릿<\/h2>\n<p>복사해서 <code>CLAUDE.md<\/code>로 저장한 뒤 <code>( )<\/code> 부분을 채우세요.<\/p>\n<pre><code class=\"language-markdown\"># CLAUDE.md\n\n## 프로젝트 개요\n- 목적: (무엇을 만드는지 한두 줄)\n- 사용자: (누가 쓰는지)\n\n## 기술 스택\n- 언어/프레임워크: (예: HTML, CSS, JavaScript)\n- 라이브러리: (쓰지 않음 / 사용하는 것)\n\n## 자주 쓰는 명령어\n- 실행: (예: index.html을 브라우저로 열기 / npm run dev)\n- 테스트: (예: npm test)\n\n## 규칙\n- 한 번에 하나의 기능만 작게 만들고, 확인한 뒤 다음으로 넘어간다.\n- 새 라이브러리를 추가하기 전에 이유를 말하고 허락을 받는다.\n- API 키와 비밀번호는 코드에 쓰지 않고 .env에 둔다.\n- 기능이 완성될 때마다 커밋한다. 커밋 메시지는 한국어로.\n\n## 커뮤니케이션\n- 설명과 답변은 한국어로 한다.\n- 코딩 초보도 이해할 수 있게 쉽게 설명한다.\n- 작업이 끝나면 무엇을 바꿨는지, 내가 확인할 것이 무엇인지 짧게 정리한다.\n<\/code><\/pre>\n<hr>\n<h2>F. 자주 묻는 질문 (FAQ)<\/h2>\n<p><strong>Q. 코딩을 전혀 몰라도 쓸 수 있나요?<\/strong>\n네. 이 가이드의 미니 프로젝트는 코드를 직접 쓰지 않고 말로만 진행합니다. 다만 결과를 확인하고 &quot;왜 이렇게 했어?&quot;라고 물어보며 조금씩 이해해 가면 훨씬 잘 쓰게 됩니다.<\/p>\n<p><strong>Q. 비용은 얼마나 드나요?<\/strong>\nClaude 유료 요금제(Pro, Max 등)에 포함되어 있고, 요금제마다 사용 한도가 다릅니다. 지금 사용량은 <code>/usage<\/code>로 확인할 수 있습니다. 최신 요금은 claude.com/pricing 을 확인하세요.<\/p>\n<p><strong>Q. 내 코드가 AI 학습에 쓰이나요?<\/strong>\n계정 종류와 설정에 따라 다릅니다. Pro·Max 요금제는 <code>/privacy-settings<\/code>에서 설정을 확인하고 바꿀 수 있습니다. 자세한 내용은 Anthropic 개인정보 처리방침을 확인하세요.<\/p>\n<p><strong>Q. Claude가 만든 코드는 믿어도 되나요?<\/strong>\n대체로 잘 동작하지만 실수할 수 있습니다. 직접 실행해 보고, <code>/diff<\/code>로 변경을 확인하고, 중요한 코드는 <code>/code-review<\/code>로 점검하세요.<\/p>\n<p><strong>Q. 인터넷이 없으면 쓸 수 없나요?<\/strong>\n네, 인터넷 연결이 필요합니다.<\/p>\n<p><strong>Q. 한국어로 요청해도 되나요?<\/strong>\n네. 한국어로 요청해도 잘 이해합니다. CLAUDE.md에 &quot;답변은 한국어로&quot;를 적어 두면 답변도 항상 한국어로 받습니다.<\/p>\n<p><strong>Q. 실수로 중요한 파일을 망쳤어요!<\/strong><\/p>\n<ol>\n<li><code>/rewind<\/code>로 되돌리기 (Claude가 편집한 파일)<\/li>\n<li>안 되면 &quot;마지막 커밋 상태로 되돌려 줘&quot; (Git)<\/li>\n<li>앞으로는 큰 작업 전에 항상 커밋하세요.<\/li>\n<\/ol>\n"}],"scenarios":[{"id":"first-run","title":"첫 실행과 첫 웹페이지","lesson":"02-inst <script>
// 가상 터미널: 사용자 입력이 시나리오 단계의 기대값과 맞는지 판단한다.
// 브라우저(빌드 시 인라인)와 Node 테스트 양쪽에서 쓰므로 의존성 없이 작성한다.

function normalize(text) {
  return String(text).trim().replace(/\s+/g, " ").toLowerCase();
}

/**
 * @param {{type: string, value?: string, all?: string[], any?: string[], keys?: string[], requireArgs?: boolean}} expect
 * @param {{text?: string, key?: string}} input  text: 입력창 내용, key: 특수 키 이름
 * @returns {boolean}
 */
function matchStep(expect, input) {
  if (input.key) {
    if (expect.type === "key") return expect.value === input.key;
    return Array.isArray(expect.keys) && expect.keys.includes(input.key);
  }
  const text = normalize(input.text || "");
  if (!text) return false;
  switch (expect.type) {
    case "exact":
      return text === normalize(expect.value);
    case "prefix": {
      // requireArgs: "/plan" 처럼 명령어 뒤에 내용이 꼭 있어야 하는 경우
      const value = normalize(expect.value);
      if (text === value) return !expect.requireArgs;
      return text.startsWith(value + " ");
    }
    case "keywords": {
      const all = (expect.all || []).every((k) => text.includes(normalize(k)));
      const any = !expect.any || expect.any.some((k) => text.includes(normalize(k)));
      return all && any;
    }
    case "any":
      return true;
    default:
      return false;
  }
}

if (typeof module !== "undefined") module.exports = { matchStep, normalize };

</script>
<script>
/* global matchStep */
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("app-data").textContent);
  var LESSONS = DATA.lessons;
  var SCENARIOS = DATA.scenarios;
  var STORAGE_KEY = "ccl-progress-v1";

  // ── 진도 저장 ──────────────────────────────────────────────
  // 사생활 보호 모드 등에서 localStorage가 막혀도 앱은 동작해야 하므로 메모리 상태를 기본으로 둔다.
  var progress = loadProgress();

  function loadProgress() {
    var empty = { lessons: {}, checks: {}, scenarios: {}, theme: null, last: null };
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return empty;
      var parsed = JSON.parse(raw);
      return Object.assign(empty, parsed);
    } catch (e) {
      return empty;
    }
  }

  function saveProgress() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    } catch (e) { /* 저장할 수 없어도 화면은 계속 동작 */ }
    renderNav();
    renderProgressPill();
  }

  function completedLessonCount() {
    return LESSONS.filter(function (l) { return progress.lessons[l.id]; }).length;
  }

  function percentDone() {
    var total = LESSONS.length + SCENARIOS.length;
    var done = completedLessonCount() +
      SCENARIOS.filter(function (s) { return progress.scenarios[s.id]; }).length;
    return total ? Math.round((done / total) * 100) : 0;
  }

  // ── 공통 도우미 ────────────────────────────────────────────
  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var main = $("#main");

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (key) {
      if (key === "text") node.textContent = attrs[key];
      else if (key === "html") node.innerHTML = attrs[key];
      else if (key.indexOf("on") === 0) node.addEventListener(key.slice(2), attrs[key]);
      else node.setAttribute(key, attrs[key]);
    });
    (children || []).forEach(function (child) {
      if (child) node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
    });
    return node;
  }

  var toastTimer;
  function toast(message) {
    var t = $("#toast");
    t.textContent = message;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  function copyText(text) {
    // Android WebView의 file:// 페이지에서는 Clipboard API가 막힐 수 있어 예전 방식으로 대체한다.
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }

  function legacyCopy(text) {
    var area = el("textarea", { readonly: "", style: "position:fixed;top:-1000px;opacity:0" });
    area.value = text;
    document.body.appendChild(area);
    area.select();
    try { document.execCommand("copy"); } catch (e) { /* 무시 */ }
    document.body.removeChild(area);
  }

  function lessonById(id) {
    for (var i = 0; i < LESSONS.length; i++) if (LESSONS[i].id === id) return LESSONS[i];
    return null;
  }
  function scenarioById(id) {
    for (var i = 0; i < SCENARIOS.length; i++) if (SCENARIOS[i].id === id) return SCENARIOS[i];
    return null;
  }

  // ── 테마 ──────────────────────────────────────────────────
  function applyTheme() {
    if (progress.theme) document.documentElement.setAttribute("data-theme", progress.theme);
    else document.documentElement.removeAttribute("data-theme");
  }
  $("#theme-btn").addEventListener("click", function () {
    var dark = progress.theme
      ? progress.theme === "dark"
      : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    progress.theme = dark ? "light" : "dark";
    applyTheme();
    saveProgress();
  });

  // ── 사이드바 ──────────────────────────────────────────────
  $("#menu-btn").addEventListener("click", function () { document.body.classList.toggle("nav-open"); });
  $("#backdrop").addEventListener("click", function () { document.body.classList.remove("nav-open"); });

  function renderNav() {
    var nav = $("#nav");
    nav.innerHTML = "";
    var route = location.hash || "#/";
    nav.appendChild(navLink("#/", "🏠", "홈", route === "#/" || route === "#"));
    nav.appendChild(el("h2", { text: "가이드" }));
    LESSONS.forEach(function (lesson) {
      var href = "#/lesson/" + lesson.id;
      var done = !!progress.lessons[lesson.id];
      nav.appendChild(navLink(href, done ? "✓" : "○", lesson.title, route === href, done));
    });
    nav.appendChild(el("h2", { text: "가상 터미널 실습" }));
    nav.appendChild(navLink("#/practice", "💻", "실습 목록", route === "#/practice"));
    SCENARIOS.forEach(function (s) {
      var href = "#/practice/" + s.id;
      var done = !!progress.scenarios[s.id];
      nav.appendChild(navLink(href, done ? "✓" : "○", s.title, route === href, done));
    });
  }

  function navLink(href, icon, label, active, done) {
    return el("a", { href: href, class: "nav-link" + (active ? " active" : "") }, [
      el("span", { class: "status" + (done ? " done" : ""), text: icon, "aria-hidden": "true" }),
      el("span", { text: label })
    ]);
  }

  function renderProgressPill() {
    $("#progress-pill").textContent = percentDone() + "% 완료";
  }

  // ── 홈 ────────────────────────────────────────────────────
  function renderHome() {
    var pct = percentDone();
    var next = progress.last && lessonById(progress.last) ? lessonById(progress.last) :
      LESSONS.filter(function (l) { return !progress.lessons[l.id]; })[0] || LESSONS[0];
    var startLabel = completedLessonCount() === 0 ? "1장부터 시작하기" : "이어서 학습하기: " + next.title;

    var content = el("div", { class: "content" }, [
      el("section", { class: "hero" }, [
        el("h1", { text: "클로드 코드 첫걸음" }),
        el("p", { text: "개발이 처음이어도 괜찮아요. Claude Code를 설치하고, 말로 시켜서 실제로 동작하는 앱을 만들 때까지 함께 갑니다." }),
        el("div", { class: "bar", role: "progressbar", "aria-valuenow": String(pct), "aria-valuemin": "0", "aria-valuemax": "100" }, [
          el("span", { style: "width:" + pct + "%" })
        ]),
        el("div", { class: "bar-label" }, [
          el("span", { text: "전체 진도 " + pct + "%" }),
          el("span", { text: "가이드 " + completedLessonCount() + "/" + LESSONS.length + " · 실습 " +
            SCENARIOS.filter(function (s) { return progress.scenarios[s.id]; }).length + "/" + SCENARIOS.length })
        ]),
        el("div", { class: "btn-row" }, [
          el("a", { class: "btn", href: "#/lesson/" + next.id, text: startLabel }),
          el("a", { class: "btn ghost", href: "#/practice", text: "💻 가상 터미널 실습" }),
          el("button", { class: "btn ghost", type: "button", text: "🖨 전체 인쇄", onclick: printAll })
        ])
      ]),
      el("h2", { class: "section-title", text: "📚 가이드" }),
      el("div", { class: "grid" }, LESSONS.map(function (lesson, i) {
        return el("a", { class: "card", href: "#/lesson/" + lesson.id }, [
          progress.lessons[lesson.id] ? el("span", { class: "done-badge", text: "✓ 완료" }) : null,
          el("div", { class: "num", text: lesson.order <= 9 ? (i + 1) + "장 · " + lesson.duration : lesson.duration }),
          el("h3", { text: lesson.title.replace(/^\d+\.\s*/, "") }),
          el("p", { text: lesson.summary })
        ]);
      })),
      el("h2", { class: "section-title", text: "💻 가상 터미널 실습" }),
      el("div", { class: "grid" }, SCENARIOS.map(function (s, i) {
        return el("a", { class: "card", href: "#/practice/" + s.id }, [
          progress.scenarios[s.id] ? el("span", { class: "done-badge", text: "✓ 완료" }) : null,
          el("div", { class: "num", text: "실습 " + (i + 1) + " · " + s.steps.length + "단계" }),
          el("h3", { text: s.title }),
          el("p", { text: s.description })
        ]);
      })),
      el("p", { class: "footer-note", text: "내용 최종 확인일: " + DATA.lastVerified + " · Claude Code는 자주 업데이트되므로 공식 문서(code.claude.com/docs)도 함께 확인하세요." })
    ]);
    main.innerHTML = "";
    main.appendChild(content);
  }

  // ── 레슨 ──────────────────────────────────────────────────
  function renderLesson(id) {
    var lesson = lessonById(id);
    if (!lesson) return renderNotFound();
    progress.last = id;
    saveProgress();

    var index = LESSONS.indexOf(lesson);
    var article = el("article", { class: "article", html: lesson.html });

    // 제목 바로 아래에 시간 정보 표시
    var h1 = article.querySelector("h1");
    if (h1) {
      var meta = el("div", { class: "meta" }, [
        el("span", { class: "chip", text: "⏱ " + lesson.duration }),
        el("span", { class: "chip", text: "최종 확인 " + lesson.lastVerified })
      ]);
      h1.insertAdjacentElement("afterend", meta);
      meta.insertAdjacentElement("afterend", printBar([
        el("button", { class: "small-btn", type: "button", text: "🖨 이 장 인쇄",
          onclick: function () { printNow("클로드 코드 첫걸음 - " + lesson.title); } }),
        el("button", { class: "small-btn", type: "button", text: "📚 전체 인쇄", onclick: printAll })
      ]));
    }

    enhanceArticle(article, lesson.id);

    var related = SCENARIOS.filter(function (s) { return s.lesson === lesson.id; });
    var footer = el("div", { class: "lesson-footer" }, [
      related.length ? el("a", { class: "practice-callout", href: "#/practice/" + related[0].id }, [
        el("span", { text: "💻", style: "font-size:24px" }),
        el("span", {}, [el("strong", { text: "가상 터미널로 연습하기: " }), related[0].title])
      ]) : null,
      doneToggle(lesson.id),
      el("nav", { class: "pager" }, [
        index > 0 ? el("a", { href: "#/lesson/" + LESSONS[index - 1].id }, [
          el("small", { text: "← 이전" }), LESSONS[index - 1].title
        ]) : null,
        index < LESSONS.length - 1 ? el("a", { class: "next", href: "#/lesson/" + LESSONS[index + 1].id }, [
          el("small", { text: "다음 →" }), LESSONS[index + 1].title
        ]) : null
      ])
    ]);

    main.innerHTML = "";
    main.appendChild(el("div", { class: "content" }, [article, footer]));
    window.scrollTo(0, 0);
  }

  function doneToggle(id) {
    var btn = el("button", { class: "done-toggle", type: "button" });
    function paint() {
      var on = !!progress.lessons[id];
      btn.classList.toggle("on", on);
      btn.textContent = on ? "✓ 이 장을 완료했어요" : "이 장을 완료로 표시하기";
    }
    btn.addEventListener("click", function () {
      if (progress.lessons[id]) delete progress.lessons[id];
      else { progress.lessons[id] = true; toast("잘했어요! 🎉"); }
      saveProgress();
      paint();
    });
    paint();
    return btn;
  }

  function enhanceArticle(article, lessonId) {
    // 표는 좁은 화면에서 가로로 스크롤되도록 감싼다
    Array.prototype.forEach.call(article.querySelectorAll("table"), function (table) {
      var wrap = el("div", { class: "table-wrap" });
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });

    // 코드 블록 복사 버튼
    Array.prototype.forEach.call(article.querySelectorAll("pre"), function (pre) {
      var btn = el("button", { class: "copy-btn", type: "button", text: "복사" });
      btn.addEventListener("click", function () {
        var code = pre.querySelector("code");
        copyText((code || pre).textContent.replace(/\n$/, "")).then(function () {
          btn.textContent = "복사됨";
          btn.classList.add("copied");
          setTimeout(function () { btn.textContent = "복사"; btn.classList.remove("copied"); }, 1500);
        });
      });
      pre.appendChild(btn);
    });

    // 외부 링크는 새 창으로
    Array.prototype.forEach.call(article.querySelectorAll("a[href^='http']"), function (a) {
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener noreferrer");
    });

    // 체크리스트: 체크 상태를 레슨별로 저장
    var saved = progress.checks[lessonId] || [];
    Array.prototype.forEach.call(article.querySelectorAll("li > input[type='checkbox']"), function (box, i) {
      var li = box.parentNode;
      box.removeAttribute("disabled");
      box.checked = saved.indexOf(i) !== -1;
      li.classList.add("task");
      li.classList.toggle("checked", box.checked);
      var label = el("label");
      while (li.firstChild) label.appendChild(li.firstChild);
      li.appendChild(label);
      box.addEventListener("change", function () {
        var list = progress.checks[lessonId] || [];
        list = list.filter(function (n) { return n !== i; });
        if (box.checked) list.push(i);
        progress.checks[lessonId] = list;
        li.classList.toggle("checked", box.checked);
        saveProgress();
      });
    });
  }

  // ── 실습 목록 ──────────────────────────────────────────────
  function renderPracticeList() {
    main.innerHTML = "";
    main.appendChild(el("div", { class: "content" }, [
      el("div", { class: "article" }, [
        el("h1", { text: "💻 가상 터미널 실습" }),
        el("p", { text: "실제 Claude Code 화면을 흉내 낸 연습장입니다. 실제 명령이나 AI를 실행하지 않으니 마음껏 틀려도 괜찮아요. 화면 위의 목표를 보고 터미널에 직접 입력해 보세요." }),
        el("blockquote", {}, [el("p", { text: "💡 연습장의 Claude 답변은 미리 준비된 예시입니다. 실제 Claude Code의 답변과 화면은 조금 다를 수 있어요." })])
      ]),
      el("div", { class: "grid" }, SCENARIOS.map(function (s, i) {
        var lesson = lessonById(s.lesson);
        return el("a", { class: "card", href: "#/practice/" + s.id }, [
          progress.scenarios[s.id] ? el("span", { class: "done-badge", text: "✓ 완료" }) : null,
          el("div", { class: "num", text: "실습 " + (i + 1) + " · " + s.steps.length + "단계" }),
          el("h3", { text: s.title }),
          el("p", { text: s.description + (lesson ? " (관련: " + lesson.title + ")" : "") })
        ]);
      }))
    ]));
    window.scrollTo(0, 0);
  }

  // ── 가상 터미널 ────────────────────────────────────────────
  function renderPractice(id) {
    var scenario = scenarioById(id);
    if (!scenario) return renderNotFound();

    var stepIndex = 0;
    var wrongCount = 0;
    var mode = scenario.startMode || "shell";
    var shellPrompt = scenario.shell || "PS C:\\Users\\me\\my-first-project>";
    var lastEsc = 0;

    var stepLabel = el("div", { class: "step" });
    var goalText = el("p", { class: "goal" });
    var hintBox = el("div", { class: "hint", hidden: "" });
    var hintBtn = el("button", { class: "small-btn", type: "button", text: "💡 힌트 보기" });
    var resetBtn = el("button", { class: "small-btn", type: "button", text: "↺ 처음부터" });
    var goalBox = el("section", { class: "goal-box", "aria-live": "polite" }, [
      stepLabel, goalText, hintBox, el("div", { class: "goal-actions" }, [hintBtn, resetBtn])
    ]);

    var screen = el("div", { class: "terminal", role: "log", "aria-label": "가상 터미널" });
    var promptEl = el("span", { class: "prompt" });
    var input = el("input", {
      type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false",
      "aria-label": "터미널 입력", enterkeyhint: "send"
    });
    var inputRow = el("div", { class: "input-row" }, [promptEl, input]);
    screen.appendChild(inputRow);

    var keyShift = el("button", { type: "button", text: "Shift+Tab" });
    var keyEsc = el("button", { type: "button", text: "Esc" });
    var keySend = el("button", { type: "button", class: "send", text: "보내기 ⏎" });
    var keybar = el("div", { class: "keybar" }, [keyShift, keyEsc, keySend]);
    var completeArea = el("div");

    function printLine(raw) {
      var cls = "line";
      var text = raw;
      var m = /^(claude|dim|tool|ok|warn|ask|status|user):(.*)$/.exec(raw);
      if (m) { cls += " " + m[1]; text = m[2]; }
      screen.insertBefore(el("div", { class: cls, text: text || " " }), inputRow);
    }

    function paintPrompt() {
      promptEl.textContent = mode === "claude" ? "❯" : shellPrompt;
    }

    function paintGoal() {
      var step = scenario.steps[stepIndex];
      stepLabel.textContent = "단계 " + (stepIndex + 1) + " / " + scenario.steps.length;
      goalText.textContent = step.goal;
      hintBox.hidden = true;
      hintBox.textContent = step.hint;
      wrongCount = 0;
    }

    function scrollBottom() { screen.scrollTop = screen.scrollHeight; }

    function submit(inputValue) {
      if (stepIndex >= scenario.steps.length) return;
      var step = scenario.steps[stepIndex];
      if (inputValue.text !== undefined) {
        printLine("user:" + (mode === "claude" ? "❯ " : shellPrompt + " ") + inputValue.text);
      } else {
        printLine("dim:[" + (inputValue.key === "esc-esc" ? "Esc Esc" : "Shift+Tab") + "]");
      }

      if (matchStep(step.expect, inputValue)) {
        step.output.forEach(printLine);
        if (step.shell) shellPrompt = step.shell;
        if (step.mode) mode = step.mode;
        stepIndex += 1;
        paintPrompt();
        if (stepIndex < scenario.steps.length) paintGoal();
        else finish();
      } else {
        wrongCount += 1;
        printLine("warn:  ⚠ 이번 목표와 달라요. " + (wrongCount >= 2 ? "힌트: " + step.hint : "목표를 다시 읽고 입력해 보세요."));
        if (wrongCount >= 2) hintBox.hidden = false;
      }
      scrollBottom();
    }

    function finish() {
      progress.scenarios[scenario.id] = true;
      saveProgress();
      stepLabel.textContent = "완료!";
      goalText.textContent = "모든 단계를 마쳤어요. 이제 실제 Claude Code에서도 해 보세요.";
      hintBox.hidden = true;
      input.disabled = true;
      var idx = SCENARIOS.indexOf(scenario);
      var nextScenario = SCENARIOS[idx + 1];
      var lesson = lessonById(scenario.lesson);
      completeArea.innerHTML = "";
      completeArea.appendChild(el("div", { class: "complete-box" }, [
        el("h3", { text: "🎉 실습 완료: " + scenario.title }),
        el("div", { class: "btn-row" }, [
          nextScenario ? el("a", { class: "btn", href: "#/practice/" + nextScenario.id, text: "다음 실습 →" }) : null,
          lesson ? el("a", { class: "btn ghost", href: "#/lesson/" + lesson.id, text: "관련 가이드 보기" }) : null,
          el("button", { class: "btn ghost", type: "button", text: "다시 하기", onclick: function () { renderPractice(id); } })
        ])
      ]));
      toast("실습 완료! 🎉");
    }

    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault();
        var value = input.value;
        if (!value.trim()) return;
        input.value = "";
        submit({ text: value });
      } else if (event.key === "Tab" && event.shiftKey) {
        event.preventDefault();
        submit({ key: "shift+tab" });
      } else if (event.key === "Escape") {
        event.preventDefault();
        pressEsc();
      }
    });

    function pressEsc() {
      if (input.value) { input.value = ""; return; }
      var now = Date.now();
      if (now - lastEsc < 700) { lastEsc = 0; submit({ key: "esc-esc" }); }
      else { lastEsc = now; toast("Esc 한 번: 작업 멈추기 · 빈 입력창에서 두 번: 되돌리기 메뉴"); }
    }

    keyShift.addEventListener("click", function () { submit({ key: "shift+tab" }); input.focus(); });
    keyEsc.addEventListener("click", function () { pressEsc(); input.focus(); });
    keySend.addEventListener("click", function () {
      var value = input.value;
      if (!value.trim()) { input.focus(); return; }
      input.value = "";
      submit({ text: value });
      input.focus();
    });
    hintBtn.addEventListener("click", function () { hintBox.hidden = !hintBox.hidden; });
    resetBtn.addEventListener("click", function () { renderPractice(id); });
    screen.addEventListener("click", function () { if (!input.disabled) input.focus(); });

    main.innerHTML = "";
    main.appendChild(el("div", { class: "content" }, [
      el("div", { class: "article" }, [
        el("h1", { text: "💻 " + scenario.title }),
        el("p", { text: scenario.description })
      ]),
      goalBox, screen, keybar, completeArea
    ]));

    printLine("dim:가상 터미널 연습장 — 실제 명령은 실행되지 않습니다.");
    if (mode === "claude") {
      printLine("claude:✻ Claude Code");
      printLine("dim:  cwd: C:\\Users\\me\\my-first-project");
    }
    paintPrompt();
    paintGoal();
    window.scrollTo(0, 0);
    // 폰에서는 화면 키보드가 갑자기 올라오지 않도록 넓은 화면에서만 자동 포커스
    if (window.matchMedia && window.matchMedia("(min-width: 901px)").matches) input.focus();
  }

  // ── 인쇄 ──────────────────────────────────────────────────
  // Android 앱의 WebView는 window.print()를 지원하지 않아서, 앱이 넣어 주는
  // AndroidPrint.print()로 기기의 인쇄 화면(PDF 저장 포함)을 연다.
  var pendingPrintAll = false;

  function printBar(buttons) {
    return el("div", { class: "print-bar no-print" }, buttons);
  }

  function printNow(jobName) {
    // 접혀 있는 퀴즈 정답도 인쇄되도록 모두 펼친다
    Array.prototype.forEach.call(document.querySelectorAll("details"), function (d) { d.open = true; });
    if (window.AndroidPrint && typeof window.AndroidPrint.print === "function") {
      window.AndroidPrint.print(jobName);
    } else {
      window.print();
    }
  }

  function printAll() {
    if (location.hash === "#/print") {
      printNow("클로드 코드 첫걸음 - 전체");
      return;
    }
    pendingPrintAll = true;
    location.hash = "#/print";
  }

  function renderPrintAll() {
    var sections = LESSONS.map(function (lesson) {
      var article = el("article", { class: "article print-lesson", html: lesson.html });
      enhanceArticle(article, lesson.id);
      return article;
    });
    var cover = el("section", { class: "article print-cover" }, [
      el("h1", { text: "클로드 코드 첫걸음" }),
      el("p", { text: "개발 초보자를 위한 Claude Code 사용법 가이드" }),
      el("p", { class: "print-date", text: "내용 최종 확인일: " + DATA.lastVerified }),
      el("h2", { text: "차례" }),
      el("ol", { class: "print-toc" }, LESSONS.map(function (lesson) {
        return el("li", { text: lesson.title.replace(/^\d+\.\s*/, "") + " (" + lesson.duration + ")" });
      }))
    ]);
    main.innerHTML = "";
    main.appendChild(el("div", { class: "content" }, [
      printBar([
        el("button", { class: "btn", type: "button", text: "🖨 인쇄하기",
          onclick: function () { printNow("클로드 코드 첫걸음 - 전체"); } }),
        el("a", { class: "btn ghost", href: "#/", text: "← 홈으로" })
      ]),
      cover
    ].concat(sections)));
    window.scrollTo(0, 0);
    if (pendingPrintAll) {
      pendingPrintAll = false;
      // 화면이 다 그려진 뒤에 인쇄 창을 연다
      setTimeout(function () { printNow("클로드 코드 첫걸음 - 전체"); }, 300);
    }
  }

  function renderNotFound() {
    main.innerHTML = "";
    main.appendChild(el("div", { class: "content article" }, [
      el("h1", { text: "페이지를 찾을 수 없어요" }),
      el("p", {}, [el("a", { href: "#/", text: "홈으로 가기" })])
    ]));
  }

  // ── 라우팅 ────────────────────────────────────────────────
  function route() {
    document.body.classList.remove("nav-open");
    var hash = location.hash || "#/";
    var parts = hash.replace(/^#\/?/, "").split("/");
    if (!parts[0]) renderHome();
    else if (parts[0] === "lesson") renderLesson(decodeURIComponent(parts[1] || ""));
    else if (parts[0] === "practice" && parts[1]) renderPractice(decodeURIComponent(parts[1]));
    else if (parts[0] === "practice") renderPracticeList();
    else if (parts[0] === "print") renderPrintAll();
    else renderNotFound();
    renderNav();
    renderProgressPill();
  }

  window.addEventListener("hashchange", route);
  applyTheme();
  route();
})();

</script>
</body>
</html>
